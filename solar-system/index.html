<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>🌌 COSMOS 3D - Solar System Explorer</title>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>  
    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;600&display=swap');  
        *{margin:0;padding:0;box-sizing:border-box}  
        body{background:#000;overflow:hidden;font-family:'Exo 2',sans-serif;color:#fff}  
        canvas{display:block;cursor:grab}  
        canvas:active{cursor:grabbing}

        .hud{position:fixed;z-index:100;pointer-events:none}  
        .top{top:0;left:0;width:100%;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;  
            background:linear-gradient(180deg,rgba(0,0,0,.92)0%,rgba(0,0,0,.3)70%,transparent)}  
        .logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;  
            background:linear-gradient(135deg,#00d4ff,#7b2ff7,#ff2d95);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px}  
        .logo-s{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:5px;  
            background:linear-gradient(90deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}  
        .ctrls{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}  
        .btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#888;padding:5px 12px;  
            border-radius:16px;font-family:'Orbitron',sans-serif;font-size:8px;cursor:pointer;transition:all .3s;  
            letter-spacing:1.5px;user-select:none;backdrop-filter:blur(8px)}  
        .btn:hover,.btn.on{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.5);color:#00d4ff;  
            box-shadow:0 0 12px rgba(0,212,255,.2)}

        .bot{bottom:0;left:0;width:100%;display:flex;justify-content:center;padding:0 8px 8px;  
            background:linear-gradient(0deg,rgba(0,0,0,.95)0%,rgba(0,0,0,.4)60%,transparent)}  
        .pbar{display:flex;gap:3px;align-items:flex-end;pointer-events:auto;padding:8px 14px 6px;  
            background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:18px;  
            backdrop-filter:blur(10px);overflow-x:auto;max-width:100%;scrollbar-width:none}  
        .pbar::-webkit-scrollbar{display:none}  
        .pd{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;  
            padding:5px 8px 3px;border-radius:12px;transition:all .3s cubic-bezier(.34,1.56,.64,1);min-width:52px;flex-shrink:0;position:relative}  
        .pd:hover{background:rgba(255,255,255,.06);transform:translateY(-3px)}  
        .pd.sel{background:rgba(0,212,255,.08);transform:translateY(-5px)}  
        .pd.sel::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);  
            width:20px;height:2px;background:var(--c);border-radius:1px;box-shadow:0 0 8px var(--c)}  
        .pd-orb{width:30px;height:30px;border-radius:50%;box-shadow:0 0 8px var(--c);  
            transition:transform .3s,box-shadow .3s;overflow:hidden;position:relative;z-index:2}  
        .pd-orb img{width:100%;height:100%;object-fit:cover;border-radius:50%}  
        .pd:hover .pd-orb{transform:scale(1.15);box-shadow:0 0 16px var(--c)}  
        .pd.sel .pd-orb{transform:scale(1.2);box-shadow:0 0 20px var(--c)}  
        .pd-name{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:1px;color:#555;  
            transition:color .3s;text-align:center;white-space:nowrap}  
        .pd:hover .pd-name{color:#aaa}  
        .pd.sel .pd-name{color:#00d4ff}

        .ip{position:fixed;right:-500px;top:50%;transform:translateY(-50%);width:420px;max-height:92vh;z-index:200;  
            transition:right .5s cubic-bezier(.22,1,.36,1);overflow-y:auto;scrollbar-width:none}  
        .ip::-webkit-scrollbar{display:none}  
        .ip.open{right:14px}  
        .icard{background:rgba(6,6,24,.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.06);  
            border-radius:20px;overflow:hidden;position:relative}  
        .icard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);z-index:5;border-radius:20px 20px 0 0}  
        .hero-wrap{position:relative;width:100%;height:220px;overflow:hidden}  
        .hero-img{width:100%;height:100%;object-fit:cover;display:block;background:#0a0a1a}  
        .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,24,0)20%,rgba(6,6,24,.98)95%)}  
        .xb{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;  
            background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#aaa;font-size:15px;  
            cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;z-index:10;backdrop-filter:blur(8px)}  
        .xb:hover{background:rgba(255,50,50,.3);border-color:#f44;color:#f44}  
        .ic-body{padding:0 26px 26px;margin-top:-40px;position:relative;z-index:3}  
        .ph{display:flex;align-items:center;gap:14px;margin-bottom:18px}  
        .picon{width:58px;height:58px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.12);  
            overflow:hidden;box-shadow:0 0 20px var(--ac2,rgba(0,0,0,.5));background:#111}  
        .picon img{width:100%;height:100%;object-fit:cover}  
        .pn{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;letter-spacing:3px;text-shadow:0 0 20px rgba(0,0,0,.8)}  
        .pty{font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-top:3px}  
        .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}  
        .si{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:13px;transition:all .25s}  
        .si:hover{background:rgba(255,255,255,.07);transform:translateY(-2px);border-color:rgba(255,255,255,.1)}  
        .sl{font-size:8px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}  
        .sv{font-family:'Orbitron',sans-serif;font-size:13px;color:#00d4ff}  
        .fb{background:linear-gradient(135deg,rgba(123,47,247,.1),rgba(0,212,255,.1));  
            border:1px solid rgba(123,47,247,.18);border-radius:12px;padding:14px}  
        .fti{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:3px;color:#7b2ff7;margin-bottom:6px}  
        .ftx{font-size:12px;line-height:1.65;color:#ccc}  
        .mb{margin-top:14px}  
        .mla{font-size:8px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:6px}  
        .mtt{display:flex;flex-wrap:wrap;gap:5px}  
        .mg{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:3px 9px;border-radius:10px;font-size:9px;color:#aaa}  
        .pcred{font-size:7px;color:#444;margin-top:12px;letter-spacing:1px}

        .side{position:fixed;z-index:150;display:flex;flex-direction:column;align-items:center;gap:5px}  
        .lc{left:14px;top:50%;transform:translateY(-50%)}  
        .rc{right:14px;bottom:90px}  
        .sb{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);  
            color:#777;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;user-select:none}  
        .sb:hover{background:rgba(0,212,255,.12);border-color:#00d4ff;color:#00d4ff;box-shadow:0 0 10px rgba(0,212,255,.2)}  
        .sb.hm{background:rgba(123,47,247,.1);border-color:rgba(123,47,247,.3);color:#a78bfa;font-size:8px;font-family:'Orbitron',sans-serif}  
        .sl2{font-family:'Orbitron',sans-serif;font-size:7px;color:#444;letter-spacing:1.5px}  
        .sv2{font-family:'Orbitron',sans-serif;font-size:9px;color:#00d4ff}  
        .focusName{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:100;  
            font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:5px;color:rgba(255,255,255,.2);  
            pointer-events:none;transition:opacity .5s;text-shadow:0 0 15px rgba(0,212,255,.2)}  
        .hint{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:100;  
            font-family:'Orbitron',sans-serif;font-size:7px;color:rgba(255,255,255,.1);letter-spacing:2px;pointer-events:none}  
        .ld{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.5s,visibility 1.5s}  
        .ld.go{opacity:0;visibility:hidden;pointer-events:none}  
        .ld-t{font-family:'Orbitron',sans-serif;font-size:38px;font-weight:900;  
            background:linear-gradient(135deg,#00d4ff,#7b2ff7,#ff2d95);-webkit-background-clip:text;-webkit-text-fill-color:transparent;  
            margin-bottom:28px;animation:pg 2s ease-in-out infinite}  
        @keyframes pg{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}  
        .ld-bg{width:240px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}  
        .ld-f{width:0%;height:100%;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#ff2d95);border-radius:2px;transition:width .3s}  
        .ld-m{margin-top:14px;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:3px;color:#333}  
        .ld-sub{margin-top:8px;font-size:10px;color:#222;letter-spacing:1px}  
        @media(max-width:900px){.logo{font-size:13px}.ctrls{gap:3px}.btn{padding:4px 8px;font-size:7px}  
            .ip{width:95vw}.ip.open{right:2.5vw}.pd{min-width:42px;padding:4px 5px 2px}.pd-orb{width:24px;height:24px}.pd-name{font-size:5.5px}}  
    </style>  
</head>  
<body>

<div class="ld" id="ld">  
    <div class="ld-t">COSMOS</div>  
    <div class="ld-bg"><div class="ld-f" id="ldf"></div></div>  
    <div class="ld-m" id="ldm">LOADING TEXTURES...</div>  
    <div class="ld-sub" id="ldsub"></div>  
</div>

<div class="hud top">  
    <div><div class="logo">COSMOS</div><div class="logo-s">3D SOLAR SYSTEM</div></div>  
    <div class="ctrls">  
        <button class="btn on" id="bOrb" onclick="togOrb()">ORBITS</button>  
        <button class="btn" id="bLab" onclick="togLab()">LABELS</button>  
        <button class="btn" id="bMus" onclick="togMus()">🔇 MUSIC</button>  
        <button class="btn" id="bNov" onclick="doNova()">⚡ NOVA</button>  
        <button class="btn" id="bRst" onclick="resetCam()">⌂ RESET</button>  
    </div>  
</div>

<div class="focusName" id="focusName"></div>  
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM · CLICK PLANET FOR INFO</div>  
<div class="hud bot"><div class="pbar" id="pbar"></div></div>

<div class="side lc">  
    <div class="sv2" id="spdV">1.0x</div>  
    <div class="sb" onclick="spdUp()">▶▶</div>  
    <div class="sb" onclick="spdDn()">▶</div>  
    <div class="sl2">SPEED</div>  
</div>  
<div class="side rc">  
    <div class="sb" onclick="zmIn()" style="font-weight:bold">+</div>  
    <div class="sv2" id="zmV">1.0x</div>  
    <div class="sb" onclick="zmOut()" style="font-weight:bold">−</div>  
    <div class="sl2">ZOOM</div>  
    <div style="height:6px"></div>  
    <div class="sb hm" onclick="resetCam()">HOME</div>  
</div>

<div class="ip" id="ip">  
    <div class="icard" id="icard" style="--ac:#00d4ff;--ac2:rgba(0,212,255,.3)">  
        <button class="xb" onclick="closeInfo()">✕</button>  
        <div class="hero-wrap"><img class="hero-img" id="heroImg" src=""><div class="hero-overlay"></div></div>  
        <div class="ic-body">  
            <div class="ph">  
                <div class="picon"><img id="picImg" src=""></div>  
                <div><div class="pn" id="pnm"></div><div class="pty" id="pty"></div></div>  
            </div>  
            <div class="sg" id="pst"></div>  
            <div class="fb"><div class="fti">✦ COOL FACT</div><div class="ftx" id="pft"></div></div>  
            <div class="mb" id="pmb"><div class="mla">KNOWN MOONS</div><div class="mtt" id="pmt"></div></div>  
            <div class="pcred" id="pcred"></div>  
        </div>  
    </div>  
</div>

<script>  
/*  
 * ============================================  
 *  TEXTURE & PHOTO PATHS  
 *  These point to YOUR local files in the repo  
 * ============================================  
 */  
const TEX = {  
    sun:         "textures/2k_sun.jpg",  
    mercury:     "textures/2k_mercury.jpg",  
    venus:       "textures/2k_venus_atmosphere.jpg",  
    earth:       "textures/2k_earth_daymap.jpg",  
    earthClouds: "textures/2k_earth_clouds.jpg",  
    mars:        "textures/2k_mars.jpg",  
    jupiter:     "textures/2k_jupiter.jpg",  
    saturn:      "textures/2k_saturn.jpg",  
    saturnRing:  "textures/2k_saturn_ring_alpha.png",  
    uranus:      "textures/2k_uranus.jpg",  
    neptune:     "textures/2k_neptune.jpg",  
};

const PHOTOS = {  
    Sun:     { img:"photos/sun.jpg",     credit:"📷 NASA/SDO" },  
    Mercury: { img:"photos/mercury.jpg", credit:"📷 NASA/MESSENGER" },  
    Venus:   { img:"photos/venus.jpg",   credit:"📷 NASA/JPL-Caltech" },  
    Earth:   { img:"photos/earth.jpg",   credit:"📷 NASA/Apollo 17" },  
    Mars:    { img:"photos/mars.jpg",    credit:"📷 NASA/JPL" },  
    Jupiter: { img:"photos/jupiter.jpg", credit:"📷 NASA/Juno" },  
    Saturn:  { img:"photos/saturn.jpg",  credit:"📷 NASA/Cassini" },  
    Uranus:  { img:"photos/uranus.jpg",  credit:"📷 NASA/Voyager 2" },  
    Neptune: { img:"photos/neptune.jpg", credit:"📷 NASA/Voyager 2" },  
    Pluto:   { img:"photos/pluto.jpg",   credit:"📷 NASA/New Horizons" }  
};

// Planet data  
const DATA=[  
{name:"Sun",type:"G-Type Main Sequence Star",r:5,orbit:0,spd:0,tex:'sun',  
 stats:{Diameter:"1,392,700 km",Mass:"1.989 × 10³⁰ kg",Temperature:"5,778 K",Age:"4.6 Billion yrs"},  
 fact:"The Sun accounts for 99.86% of the Solar System's mass. It fuses 600 million tons of hydrogen every second! The core reaches 15 million°C. Light takes ~8 minutes to reach Earth.",  
 moons:[],css:"#FDB813",g:["#FDB813","#FF6B35"]},  
{name:"Mercury",type:"Terrestrial Planet",r:.5,orbit:9,spd:4.15,tex:'mercury',  
 stats:{Diameter:"4,879 km",Distance:"57.9M km",Day:"59 Earth days",Year:"88 days"},  
 fact:"Mercury swings from -180°C to 430°C — the wildest temperature swings in the Solar System. Its massive iron core is 85% of its radius. It has ice in permanently shadowed craters!",  
 moons:[],css:"#B5B5B5",g:["#C2C2C2","#757575"]},  
{name:"Venus",type:"Terrestrial Planet",r:.9,orbit:13,spd:1.62,tex:'venus',  
 stats:{Diameter:"12,104 km",Distance:"108.2M km",Day:"243 Earth days",Year:"225 days"},  
 fact:"Venus rotates BACKWARDS so the Sun rises in the West! At 465°C it's the hottest planet — its crushing CO₂ atmosphere is 90× Earth's pressure with sulfuric acid clouds!",  
 moons:[],css:"#E8CDA0",g:["#EDD59E","#C08B50"]},  
{name:"Earth",type:"Terrestrial Planet",r:1,orbit:18,spd:1.0,tex:'earth',  
 stats:{Diameter:"12,742 km",Distance:"149.6M km",Day:"24 hours",Year:"365.25 days"},  
 fact:"Earth is the only known planet with confirmed life, liquid oceans covering 71% of its surface, and active plate tectonics. Our magnetic field shields us from deadly solar radiation!",  
 moons:["Moon"],css:"#4A90D9",g:["#6B93D6","#2E5E8E"]},  
{name:"Mars",type:"Terrestrial Planet",r:.7,orbit:23,spd:.53,tex:'mars',  
 stats:{Diameter:"6,779 km",Distance:"227.9M km",Day:"24h 37min",Year:"687 days"},  
 fact:"Mars has Olympus Mons (21.9km tall, 3× Everest) and Valles Marineris (4,000 km canyon)! It has polar ice caps and planet-engulfing dust storms lasting months!",  
 moons:["Phobos","Deimos"],css:"#E27B58",g:["#E27B58","#8B3A2A"]},  
{name:"Jupiter",type:"Gas Giant",r:3.2,orbit:36,spd:.084,tex:'jupiter',  
 stats:{Diameter:"139,820 km",Distance:"778.5M km",Day:"9h 56min",Year:"11.86 yrs"},  
 fact:"Jupiter's Great Red Spot is a 350+ year old storm larger than Earth! It has 95 known moons — Europa may harbor life under its icy ocean. Jupiter's gravity shields Earth from asteroids!",  
 moons:["Io","Europa","Ganymede","Callisto","+91 more"],css:"#C88B3A",g:["#D4A06A","#8B6914"]},  
{name:"Saturn",type:"Gas Giant",r:2.7,orbit:48,spd:.034,tex:'saturn',hasRings:true,  
 stats:{Diameter:"116,460 km",Distance:"1.43B km",Day:"10h 42min",Year:"29.46 yrs"},  
 fact:"Saturn's rings span 282,000 km but are only 10m thick! It could float in water. Inside Saturn, extreme pressure crushes carbon into diamond rain! Titan has methane lakes.",  
 moons:["Titan","Enceladus","Mimas","Rhea","+92 more"],css:"#E8D5A3",g:["#F0DCA0","#A08040"]},  
{name:"Uranus",type:"Ice Giant",r:1.8,orbit:58,spd:.012,tex:'uranus',hasRings:true,thinR:true,  
 stats:{Diameter:"50,724 km",Distance:"2.87B km",Day:"17h 14min",Year:"84 yrs"},  
 fact:"Uranus rolls on its SIDE with a 98° tilt — knocked over by a massive collision! Coldest atmosphere at -224°C. Its 27 moons are named after Shakespeare characters!",  
 moons:["Miranda","Ariel","Umbriel","Titania","+23 more"],css:"#72C5D0",g:["#8FE0E8","#5BA3AD"]},  
{name:"Neptune",type:"Ice Giant",r:1.7,orbit:68,spd:.006,tex:'neptune',  
 stats:{Diameter:"49,244 km",Distance:"4.5B km",Day:"16h 6min",Year:"165 yrs"},  
 fact:"Neptune has supersonic winds at 2,100 km/h! It radiates 2.6× more heat than it receives. Triton orbits backwards with nitrogen geysers and will eventually be torn apart!",  
 moons:["Triton","Nereid","Proteus","+13 more"],css:"#3E54E8",g:["#5B6AE8","#2B3BAF"]},  
{name:"Pluto",type:"Dwarf Planet",r:.35,orbit:78,spd:.004,tex:'pluto',  
 stats:{Diameter:"2,377 km",Distance:"5.9B km",Day:"6.4 Earth days",Year:"248 yrs"},  
 fact:"Pluto has a giant heart-shaped glacier (Tombaugh Regio) of nitrogen ice! Charon is so big they orbit each other. Visited by New Horizons in 2015!",  
 moons:["Charon","Nix","Hydra","Kerberos","Styx"],css:"#C4A882",g:["#D4BC9E","#A68B6B"]}  
];

// ===== THREE.JS =====  
const renderer=new THREE.WebGLRenderer({antialias:true});  
renderer.setSize(window.innerWidth,window.innerHeight);  
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));  
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;  
document.body.prepend(renderer.domElement);  
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000005);  
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,.1,2000);

let camTarget=new THREE.Vector3(),tCamTarget=new THREE.Vector3();  
let camTheta=.4,camPhi=1.1,camDist=55,tTheta=.4,tPhi=1.1,tDist=55;  
let isDrag=false,prevMX=0,prevMY=0,autoRot=true;  
let showOrb=true,showLab=false,spdMul=1,selected=null,selIdx=-1;  
let musOn=false,actx,oscArr=[],novaOn=false,novaT=0;

scene.add(new THREE.AmbientLight(0x222244,.3));  
const sunPt=new THREE.PointLight(0xfff5e0,2.8,500,1.2);scene.add(sunPt);  
const sunPt2=new THREE.PointLight(0xffaa44,1.5,250,2);scene.add(sunPt2);  
const fillLight=new THREE.PointLight(0x6688cc,0,60,2);fillLight.visible=false;scene.add(fillLight);  
const camFill=new THREE.DirectionalLight(0x4466aa,0);scene.add(camFill);

// Stars  
const stG=new THREE.BufferGeometry(),SN=12000,sP=new Float32Array(SN*3),sC=new Float32Array(SN*3);  
for(let i=0;i<SN;i++){const th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1),r=300+Math.random()*600;  
    sP[i*3]=r*Math.sin(ph)*Math.cos(th);sP[i*3+1]=r*Math.sin(ph)*Math.sin(th);sP[i*3+2]=r*Math.cos(ph);  
    const t=Math.random();sC[i*3]=.8+t*.2;sC[i*3+1]=.75+t*.25;sC[i*3+2]=.85+(1-t)*.15;}  
stG.setAttribute('position',new THREE.BufferAttribute(sP,3));stG.setAttribute('color',new THREE.BufferAttribute(sC,3));  
scene.add(new THREE.Points(stG,new THREE.PointsMaterial({size:.7,vertexColors:true,transparent:true,opacity:.85,sizeAttenuation:true})));

// Fallback texture  
function makeFallback(cols){  
    const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');  
    const g=x.createLinearGradient(0,0,512,256);cols.forEach((cl,i)=>g.addColorStop(i/(cols.length-1),cl));  
    x.fillStyle=g;x.fillRect(0,0,512,256);  
    for(let i=0;i<300;i++){x.fillStyle=`rgba(${128+Math.random()*127},${128+Math.random()*127},${128+Math.random()*127},.04)`;  
        x.beginPath();x.arc(Math.random()*512,Math.random()*256,1+Math.random()*4,0,6.28);x.fill();}  
    return new THREE.CanvasTexture(c);  
}  
const FB={sun:['#fff8e0','#ff9900','#cc5500'],mercury:['#c2c2c2','#9e9e9e','#757575'],venus:['#edd59e','#d4a56a','#c08b50'],  
    earth:['#1a4d8a','#4488cc','#2d7a3a'],mars:['#d46840','#b84828','#9a3318'],jupiter:['#c4a06a','#a07848','#d8b880'],  
    saturn:['#f0e0b0','#e8d5a3','#c4a265'],uranus:['#90dce8','#72c5d0','#5ba3ad'],neptune:['#3e54e8','#2b3baf','#4060e0'],  
    pluto:['#c4a882','#a68b6b','#8b7355']};

// Load textures  
const loader=new THREE.TextureLoader();  
const loaded={};let texDone=0,texTotal=0;

function loadT(key,url){texTotal++;return new Promise(r=>{  
    loader.load(url,t=>{t.anisotropy=renderer.capabilities.getMaxAnisotropy();loaded[key]=t;texDone++;updLd();r(t);},  
    undefined,()=>{console.warn('Failed:',key);texDone++;updLd();r(null);});});}

function updLd(){  
    const p=texTotal?Math.round((texDone/texTotal)*100):0;  
    document.getElementById('ldf').style.width=p+'%';  
    const m=['LOADING NASA TEXTURES...','MAPPING SURFACES...','BUILDING ORBITS...','CALIBRATING...','ALMOST READY...','READY ✦'];  
    document.getElementById('ldm').textContent=m[Math.min(Math.floor(p/18),m.length-1)];  
    document.getElementById('ldsub').textContent=texDone+'/'+texTotal+' textures';}

const meshes=[],orbLines=[],lbls=[],ray=new THREE.Raycaster(),mouse=new THREE.Vector2();

async function init(){  
    await Promise.all(Object.entries(TEX).map(([k,u])=>loadT(k,u)));

    DATA.forEach((d,i)=>{  
        const isSun=d.name==='Sun';  
        let tex=loaded[d.tex]||makeFallback(FB[d.tex]||['#888']);  
        const geo=new THREE.SphereGeometry(d.r,64,48);  
        const mat=isSun?new THREE.MeshBasicMaterial({map:tex}):  
            new THREE.MeshStandardMaterial({map:tex,roughness:.65,metalness:.05,emissive:new THREE.Color(d.g[1]),emissiveIntensity:.06});  
        const mesh=new THREE.Mesh(geo,mat);  
        mesh.userData={idx:i,data:d,angle:Math.random()*6.28,origEI:.06};  
        scene.add(mesh);meshes.push(mesh);

        if(isSun){  
            [1.3,2.2].forEach((s,gi)=>{  
                const gm=new THREE.Mesh(new THREE.SphereGeometry(d.r*s,32,32),new THREE.ShaderMaterial({  
                    uniforms:{time:{value:0}},  
                    vertexShader:`varying vec3 vN,vP;void main(){vN=normalize(normalMatrix*normal);vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,  
                    fragmentShader:gi===0?  
                        `uniform float time;varying vec3 vN,vP;void main(){float i=pow(.65-dot(vN,vec3(0,0,1)),2.5);float f=.8+.2*sin(time*2.+vP.x*3.);vec3 c=mix(vec3(1,.7,.1),vec3(1,.3,0),i)*f;gl_FragColor=vec4(c,i*.6);}`:  
                        `uniform float time;varying vec3 vN;void main(){float i=pow(.5-dot(vN,vec3(0,0,1)),3.);float f=.7+.3*sin(time*1.5);gl_FragColor=vec4(1.,.5,.1,i*.18*f);}`,  
                    transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));  
                mesh.add(gm);if(gi===0)mesh.userData.glow1=gm;else mesh.userData.glow2=gm;  
            });  
        }  
        if(d.name==='Earth'){  
            if(loaded.earthClouds){const cl=new THREE.Mesh(new THREE.SphereGeometry(d.r*1.01,48,36),  
                new THREE.MeshStandardMaterial({map:loaded.earthClouds,transparent:true,opacity:.35,depthWrite:false}));  
                mesh.add(cl);mesh.userData.clouds=cl;}  
            mesh.add(new THREE.Mesh(new THREE.SphereGeometry(d.r*1.04,48,36),new THREE.ShaderMaterial({  
                vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,  
                fragmentShader:`varying vec3 vN;void main(){float i=pow(.7-dot(vN,vec3(0,0,1)),2.5);gl_FragColor=vec4(.3,.6,1.,i*.45);}`,  
                transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})));  
        }  
        if(d.hasRings){  
            const ir=d.r*1.25,or=d.r*(d.thinR?1.8:2.5),rG=new THREE.RingGeometry(ir,or,128);  
            const pos=rG.attributes.position,uv=rG.attributes.uv;  
            for(let j=0;j<pos.count;j++){const x=pos.getX(j),y=pos.getY(j);uv.setXY(j,(Math.sqrt(x*x+y*y)-ir)/(or-ir),.5);}  
            let rMat;  
            if(loaded.saturnRing&&!d.thinR){rMat=new THREE.MeshStandardMaterial({map:loaded.saturnRing,side:THREE.DoubleSide,transparent:true,opacity:.82,roughness:.75});}  
            else{const rc=document.createElement('canvas');rc.width=1024;rc.height=32;const rx=rc.getContext('2d');  
                for(let x=0;x<1024;x++){const t=x/1024,cass=Math.abs(t-.55)<.02?.1:1,gap=(Math.sin(t*80)*.5+.5)*(Math.sin(t*30)*.3+.7),a=(1-Math.pow(Math.abs(t-.5)*2,2))*.7*gap*cass;  
                    rx.fillStyle=d.thinR?`rgba(180,210,220,${a*.5})`:`rgba(${190+t*40},${170+t*40},${140+t*30},${a})`;rx.fillRect(x,0,1,32);}  
                rMat=new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(rc),side:THREE.DoubleSide,transparent:true,opacity:.82,roughness:.8});}  
            const ring=new THREE.Mesh(rG,rMat);ring.rotation.x=-Math.PI/2+(d.thinR?.15:.08);mesh.add(ring);  
        }  
        if(d.orbit>0){const pts=[];for(let j=0;j<=256;j++){const a=(j/256)*6.28;pts.push(new THREE.Vector3(Math.cos(a)*d.orbit,0,Math.sin(a)*d.orbit));}  
            const oL=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.05}));scene.add(oL);orbLines.push(oL);}  
        if(d.name==='Earth'){const mm=new THREE.Mesh(new THREE.SphereGeometry(.25,32,24),new THREE.MeshStandardMaterial({color:0xcccccc,roughness:.85}));scene.add(mm);mesh.userData.moon=mm;}  
        if(d.name==='Jupiter'){mesh.userData.jMoons=[0xffee55,0xaabbdd,0xddccaa,0x998877].map(c=>{const mm=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),new THREE.MeshStandardMaterial({color:c,roughness:.7}));scene.add(mm);return mm;});}  
    });

    // Asteroids  
    const aN=800,aG=new THREE.BufferGeometry(),aP=new Float32Array(aN*3);  
    for(let i=0;i<aN;i++){const a=(i/aN)*6.28,r=28+(Math.random()-.5)*4;aP[i*3]=Math.cos(a)*r+(Math.random()-.5)*2;aP[i*3+1]=(Math.random()-.5)*.6;aP[i*3+2]=Math.sin(a)*r+(Math.random()-.5)*2;}  
    aG.setAttribute('position',new THREE.BufferAttribute(aP,3));  
    scene.add(new THREE.Points(aG,new THREE.PointsMaterial({color:0x887766,size:.06,transparent:true,opacity:.5,sizeAttenuation:true})));

    // Labels  
    const lC=document.createElement('div');lC.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50';  
    document.body.appendChild(lC);DATA.forEach(d=>{const l=document.createElement('div');  
        l.style.cssText=`position:absolute;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.6);text-shadow:0 0 6px #000;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .3s`;  
        l.textContent=d.name.toUpperCase();lC.appendChild(l);lbls.push(l);});

    // Nova  
    const nM=new THREE.ShaderMaterial({uniforms:{time:{value:0},progress:{value:0}},vertexShader:`varying vec3 vN;uniform float progress;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position*(1.+progress*120.),1.);}`,fragmentShader:`uniform float time,progress;varying vec3 vN;void main(){float i=pow(.7-dot(vN,vec3(0,0,1)),1.5);float a=(1.-progress)*i;vec3 c=mix(vec3(1),mix(vec3(.4,.7,1),vec3(.5,.1,.8),progress),progress);gl_FragColor=vec4(c,a*.5);}`,transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});  
    const nMesh=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),nM);nMesh.visible=false;scene.add(nMesh);  
    window._nM=nM;window._nMesh=nMesh;

    setTimeout(()=>document.getElementById('ld').classList.add('go'),600);  
    animate();  
}

function updateCam(){camTarget.lerp(tCamTarget,.04);camTheta+=(tTheta-camTheta)*.06;camPhi+=(tPhi-camPhi)*.06;camDist+=(tDist-camDist)*.06;  
    camPhi=Math.max(.1,Math.min(Math.PI-.1,camPhi));camDist=Math.max(3,Math.min(300,camDist));  
    camera.position.x=camTarget.x+camDist*Math.sin(camPhi)*Math.cos(camTheta);camera.position.y=camTarget.y+camDist*Math.cos(camPhi);  
    camera.position.z=camTarget.z+camDist*Math.sin(camPhi)*Math.sin(camTheta);camera.lookAt(camTarget);  
    camFill.position.copy(camera.position);camFill.target.position.copy(camTarget);}

renderer.domElement.addEventListener('mousedown',e=>{isDrag=true;prevMX=e.clientX;prevMY=e.clientY;autoRot=false;});  
renderer.domElement.addEventListener('mousemove',e=>{mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;  
    if(isDrag){tTheta-=(e.clientX-prevMX)*.005;tPhi-=(e.clientY-prevMY)*.005;prevMX=e.clientX;prevMY=e.clientY;}});  
renderer.domElement.addEventListener('mouseup',()=>{isDrag=false;});  
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();tDist+=e.deltaY*.04;},{passive:false});  
renderer.domElement.addEventListener('click',()=>{ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(meshes);if(h.length>0)selPlanet(h[0].object.userData.data,h[0].object.userData.idx);});  
let lTD=0;  
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1){isDrag=true;prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY;autoRot=false;}if(e.touches.length===2)lTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);});  
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&isDrag){tTheta-=(e.touches[0].clientX-prevMX)*.005;tPhi-=(e.touches[0].clientY-prevMY)*.005;prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY;}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tDist*=lTD/d;lTD=d;}},{passive:false});  
renderer.domElement.addEventListener('touchend',()=>{isDrag=false;});  
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo();if(e.key===' '){e.preventDefault();doNova();}  
    if(e.key==='o'||e.key==='O')togOrb();if(e.key==='l'||e.key==='L')togLab();if(e.key==='m'||e.key==='M')togMus();if(e.key==='r'||e.key==='R')resetCam();  
    if(e.key==='='||e.key==='+')zmIn();if(e.key==='-')zmOut();  
    if(e.key==='ArrowLeft')tTheta+=.15;if(e.key==='ArrowRight')tTheta-=.15;if(e.key==='ArrowUp')tPhi=Math.max(.1,tPhi-.1);if(e.key==='ArrowDown')tPhi=Math.min(Math.PI-.1,tPhi+.1);  
    const n=parseInt(e.key);if(!isNaN(n)&&n>=0&&n<=9)selPlanet(DATA[n],n);});

const clock=new THREE.Clock();let tgF=0;  
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();  
    if(autoRot)tTheta+=.0008;updateCam();  
    fillLight.intensity+=(tgF-fillLight.intensity)*.08;camFill.intensity+=(tgF*.4-camFill.intensity)*.08;  
    meshes.forEach((m,i)=>{const d=DATA[i];m.userData.angle+=d.spd*.004*spdMul;  
        if(d.orbit>0){m.position.x=Math.cos(m.userData.angle)*d.orbit;m.position.z=Math.sin(m.userData.angle)*d.orbit;}  
        m.rotation.y+=(d.name==='Sun'?.001:.004)*spdMul;  
        if(d.name==='Uranus')m.rotation.z=1.71;else if(d.name==='Earth')m.rotation.z=.41;  
        if(d.name==='Sun'){sunPt.position.copy(m.position);sunPt2.position.copy(m.position);  
            if(m.userData.glow1)m.userData.glow1.material.uniforms.time.value=t;if(m.userData.glow2)m.userData.glow2.material.uniforms.time.value=t;}  
        if(m.userData.clouds)m.userData.clouds.rotation.y+=.0005*spdMul;  
        if(m.userData.moon){const a=t*.6;m.userData.moon.position.set(m.position.x+Math.cos(a)*2,Math.sin(a*.4)*.3,m.position.z+Math.sin(a)*2);}  
        if(m.userData.jMoons)m.userData.jMoons.forEach((mm,j)=>{const a=t*(.3+j*.15)+j*1.57,md=4.5+j*1.2;mm.position.set(m.position.x+Math.cos(a)*md,Math.sin(a*.3+j)*.3,m.position.z+Math.sin(a)*md);});  
        if(d.name!=='Sun'){if(selIdx===i){m.material.emissiveIntensity+=(.45-m.material.emissiveIntensity)*.08;  
            const sp=meshes[0].position,ts=sp.clone().sub(m.position).normalize();  
            fillLight.position.copy(m.position).sub(ts.multiplyScalar(d.r*4));fillLight.visible=true;}  
            else m.material.emissiveIntensity+=(m.userData.origEI-m.material.emissiveIntensity)*.05;}  
        if(selIdx===i)tCamTarget.copy(m.position);  
        if(lbls[i]){if(showLab){const p=m.position.clone();p.y+=d.r+.6;p.project(camera);lbls[i].style.left=(p.x*.5+.5)*window.innerWidth+'px';lbls[i].style.top=(-p.y*.5+.5)*window.innerHeight+'px';lbls[i].style.opacity=p.z<1?'0.7':'0';}else lbls[i].style.opacity='0';}  
    });  
    orbLines.forEach(l=>{l.visible=showOrb;});  
    if(selIdx>=0)tgF=2.5;else{tgF=0;fillLight.visible=false;}  
    if(!isDrag){ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(meshes);  
        meshes.forEach(m=>{if(m.userData.data.name!=='Sun'&&selIdx!==m.userData.idx)m.material.emissiveIntensity=m.userData.origEI;});  
        if(h.length>0){const hm=h[0].object;if(hm.userData.data.name!=='Sun'&&selIdx!==hm.userData.idx)hm.material.emissiveIntensity=.2;renderer.domElement.style.cursor='pointer';}  
        else renderer.domElement.style.cursor='grab';}  
    if(novaOn){const p=Math.min((t-novaT)/3,1);window._nM.uniforms.time.value=t;window._nM.uniforms.progress.value=p;window._nMesh.visible=true;if(p>=1){novaOn=false;window._nMesh.visible=false;}}  
    document.getElementById('zmV').textContent=(55/camDist).toFixed(1)+'x';  
    renderer.render(scene,camera);}

function selPlanet(d,idx){selected=d;selIdx=idx;playClick();  
    const m=meshes[idx];tCamTarget.copy(m.position);tDist=d.r*6+2;tPhi=1.1;  
    tTheta=Math.atan2(m.position.z,m.position.x)+.6;autoRot=false;  
    document.getElementById('focusName').textContent=d.name.toUpperCase();document.getElementById('focusName').style.opacity='1';  
    const ph=PHOTOS[d.name];  
    document.getElementById('heroImg').src=ph.img;document.getElementById('picImg').src=ph.img;  
    document.getElementById('pcred').textContent=ph.credit;  
    document.getElementById('pnm').textContent=d.name;document.getElementById('pty').textContent=d.type;  
    document.getElementById('icard').style.setProperty('--ac',d.css);document.getElementById('icard').style.setProperty('--ac2',d.css+'44');  
    const sg=document.getElementById('pst');sg.innerHTML='';  
    for(const[k,v]of Object.entries(d.stats))sg.innerHTML+=`<div class="si"><div class="sl">${k}</div><div class="sv">${v}</div></div>`;  
    document.getElementById('pft').textContent=d.fact;  
    const mb=document.getElementById('pmb'),mt=document.getElementById('pmt');  
    if(d.moons.length){mb.style.display='block';mt.innerHTML=d.moons.map(m=>`<span class="mg">${m}</span>`).join('');}else mb.style.display='none';  
    document.getElementById('ip').classList.add('open');  
    document.querySelectorAll('.pd').forEach((b,i)=>b.classList.toggle('sel',i===idx));}

function closeInfo(){document.getElementById('ip').classList.remove('open');selected=null;selIdx=-1;  
    document.querySelectorAll('.pd').forEach(b=>b.classList.remove('sel'));document.getElementById('focusName').style.opacity='0';tgF=0;}  
function togOrb(){showOrb=!showOrb;document.getElementById('bOrb').classList.toggle('on',showOrb);}  
function togLab(){showLab=!showLab;document.getElementById('bLab').classList.toggle('on',showLab);}  
function resetCam(){tCamTarget.set(0,0,0);tTheta=.4;tPhi=1.1;tDist=55;autoRot=true;closeInfo();}  
function zmIn(){tDist=Math.max(3,tDist/1.3);}function zmOut(){tDist=Math.min(300,tDist*1.3);}  
function spdUp(){spdMul=Math.min(10,spdMul*1.5);document.getElementById('spdV').textContent=spdMul.toFixed(1)+'x';}  
function spdDn(){spdMul=Math.max(.1,spdMul/1.5);document.getElementById('spdV').textContent=spdMul.toFixed(1)+'x';}  
function doNova(){novaOn=true;novaT=clock.getElapsedTime();if(window._nMesh)window._nMesh.visible=true;playNova();document.body.style.filter='brightness(3)';setTimeout(()=>{document.body.style.filter='brightness(1)';},100);}

function initA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}  
function togMus(){initA();if(musOn){oscArr.forEach(o=>{try{o.stop();}catch(e){}});oscArr=[];document.getElementById('bMus').textContent='🔇 MUSIC';document.getElementById('bMus').classList.remove('on');}  
    else{const mg=actx.createGain();mg.gain.value=.04;mg.connect(actx.destination);  
        [55,82.41,110,146.83,220].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),fl=actx.createBiquadFilter();  
            o.type=i<2?'sine':'triangle';o.frequency.value=f;const lfo=actx.createOscillator(),lg=actx.createGain();  
            lfo.frequency.value=.02+i*.01;lg.gain.value=f*.01;lfo.connect(lg);lg.connect(o.frequency);lfo.start();  
            fl.type='lowpass';fl.frequency.value=250+i*50;g.gain.value=.18-i*.025;o.connect(fl);fl.connect(g);g.connect(mg);o.start();oscArr.push(o,lfo);});  
        document.getElementById('bMus').textContent='🔊 MUSIC';document.getElementById('bMus').classList.add('on');}musOn=!musOn;}  
function playClick(){initA();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(800,actx.currentTime);o.frequency.exponentialRampToValueAtTime(1200,actx.currentTime+.08);o.frequency.exponentialRampToValueAtTime(400,actx.currentTime+.3);g.gain.setValueAtTime(.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.4);}  
function playNova(){initA();const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(80,actx.currentTime);o.frequency.exponentialRampToValueAtTime(12,actx.currentTime+3);g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+3.5);f.type='lowpass';f.frequency.value=180;o.connect(f);f.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+3.5);}

function buildBar(){const bar=document.getElementById('pbar');  
    DATA.forEach((d,i)=>{const el=document.createElement('div');el.className='pd';el.style.setProperty('--c',d.css);  
        const ph=PHOTOS[d.name];  
        el.innerHTML=`<div class="pd-orb"><img src="${ph.img}" alt="${d.name}" onerror="this.style.display='none';this.parentElement.style.background='radial-gradient(circle at 35% 35%,${d.g[0]},${d.g[1]})'"></div><div class="pd-name">${d.name.toUpperCase()}</div>`;  
        el.addEventListener('click',()=>selPlanet(d,i));bar.appendChild(el);});}

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

buildBar();init();  
</script>
