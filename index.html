<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Solar System Explorer</title>  
    <style>  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }  
        canvas { display: block; }  
          
        #ui-overlay {  
            position: fixed;  
            top: 0;  
            left: 0;  
            width: 100%;  
            height: 100%;  
            pointer-events: none;  
            z-index: 10;  
        }  
          
        #planet-info {  
            position: fixed;  
            bottom: 20px;  
            left: 50%;  
            transform: translateX(-50%);  
            background: rgba(0,0,0,0.85);  
            border: 1px solid rgba(100,150,255,0.3);  
            border-radius: 15px;  
            padding: 20px 30px;  
            color: #fff;  
            pointer-events: auto;  
            display: none;  
            min-width: 350px;  
            max-width: 500px;  
            backdrop-filter: blur(10px);  
        }  
          
        #planet-info h2 {  
            font-size: 24px;  
            margin-bottom: 8px;  
            background: linear-gradient(90deg, #64b5f6, #ce93d8);  
            -webkit-background-clip: text;  
            -webkit-text-fill-color: transparent;  
        }  
          
        #planet-info .stats {  
            display: grid;  
            grid-template-columns: 1fr 1fr;  
            gap: 5px;  
            font-size: 13px;  
            color: #aac;  
        }  
          
        #controls {  
            position: fixed;  
            top: 20px;  
            right: 20px;  
            background: rgba(0,0,0,0.8);  
            border: 1px solid rgba(100,150,255,0.3);  
            border-radius: 12px;  
            padding: 15px;  
            color: #fff;  
            pointer-events: auto;  
            font-size: 13px;  
            backdrop-filter: blur(10px);  
        }  
          
        #controls h3 {  
            margin-bottom: 10px;  
            color: #64b5f6;  
        }  
          
        #controls div { margin: 5px 0; }  
          
        #speed-control {  
            width: 100%;  
            margin-top: 5px;  
            accent-color: #64b5f6;  
        }  
          
        #music-toggle, #ambient-toggle {  
            pointer-events: auto;  
            background: rgba(100,150,255,0.2);  
            border: 1px solid rgba(100,150,255,0.4);  
            color: #fff;  
            padding: 6px 14px;  
            border-radius: 6px;  
            cursor: pointer;  
            font-size: 12px;  
            margin-top: 5px;  
            margin-right: 5px;  
        }  
          
        #music-toggle:hover, #ambient-toggle:hover {  
            background: rgba(100,150,255,0.4);  
        }  
          
        #crosshair {  
            position: fixed;  
            top: 50%;  
            left: 50%;  
            transform: translate(-50%, -50%);  
            width: 20px;  
            height: 20px;  
            pointer-events: none;  
            opacity: 0.3;  
        }  
          
        #crosshair::before, #crosshair::after {  
            content: '';  
            position: absolute;  
            background: #fff;  
        }  
          
        #crosshair::before {  
            width: 2px;  
            height: 100%;  
            left: 50%;  
            transform: translateX(-50%);  
        }  
          
        #crosshair::after {  
            width: 100%;  
            height: 2px;  
            top: 50%;  
            transform: translateY(-50%);  
        }  
          
        #now-playing {  
            position: fixed;  
            top: 20px;  
            left: 20px;  
            background: rgba(0,0,0,0.8);  
            border: 1px solid rgba(100,150,255,0.3);  
            border-radius: 12px;  
            padding: 12px 18px;  
            color: #fff;  
            pointer-events: none;  
            font-size: 13px;  
            backdrop-filter: blur(10px);  
            display: none;  
        }  
          
        #now-playing .label {  
            color: #64b5f6;  
            font-size: 10px;  
            text-transform: uppercase;  
            letter-spacing: 2px;  
        }  
          
        #now-playing .track {  
            margin-top: 4px;  
            font-size: 14px;  
            color: #ce93d8;  
        }  
          
        #visualizer {  
            position: fixed;  
            bottom: 0;  
            left: 0;  
            width: 100%;  
            height: 40px;  
            pointer-events: none;  
            opacity: 0.3;  
        }  
    </style>  
</head>  
<body>  
    <canvas id="canvas"></canvas>  
    <div id="ui-overlay">  
        <div id="crosshair"></div>  
        <div id="planet-info">  
            <h2 id="info-name"></h2>  
            <p id="info-desc" style="font-size:13px;color:#889;margin-bottom:8px;"></p>  
            <div class="stats" id="info-stats"></div>  
        </div>  
        <div id="controls">  
            <h3>🌌 Controls</h3>  
            <div>🖱️ Drag to orbit</div>  
            <div>📜 Scroll to zoom</div>  
            <div>🖱️ Click planet to focus</div>  
            <div>⎋ ESC to unfocus</div>  
            <div style="margin-top:10px;">  
                <label>Speed: <span id="speed-val">1x</span></label>  
                <input type="range" id="speed-control" min="0" max="5" step="0.1" value="1">  
            </div>  
            <div style="margin-top:8px;">  
                <button id="ambient-toggle">🎵 Space Ambient</button>  
                <button id="music-toggle">🎶 Planet Music</button>  
            </div>  
        </div>  
        <div id="now-playing">  
            <div class="label">♪ Now Playing</div>  
            <div class="track" id="track-name">Deep Space Ambient</div>  
        </div>  
    </div>  
    <canvas id="visualizer"></canvas>

    <script>  
    const canvas = document.getElementById('canvas');  
    const ctx = canvas.getContext('2d');  
    const vizCanvas = document.getElementById('visualizer');  
    const vizCtx = vizCanvas.getContext('2d');

    let W, H;  
    function resize() {  
        W = canvas.width = window.innerWidth;  
        H = canvas.height = window.innerHeight;  
        vizCanvas.width = W;  
        vizCanvas.height = 40;  
    }  
    resize();  
    window.addEventListener('resize', resize);

    // ============ AUDIO ENGINE ============  
    let audioCtx = null;  
    let masterGain = null;  
    let ambientEnabled = false;  
    let planetMusicEnabled = false;  
    let ambientNodes = [];  
    let planetMusicNodes = [];  
    let currentPlanetMusic = null;  
    let analyser = null;  
    let analyserData = null;

    function initAudio() {  
        if (audioCtx) return;  
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();  
        masterGain = audioCtx.createGain();  
        masterGain.gain.value = 0.5;  
        masterGain.connect(audioCtx.destination);  
          
        analyser = audioCtx.createAnalyser();  
        analyser.fftSize = 256;  
        analyserData = new Uint8Array(analyser.frequencyBinCount);  
        masterGain.connect(analyser);  
    }

    // Deep space ambient - layered drones  
    function startAmbient() {  
        if (!audioCtx) initAudio();  
        stopAmbient();  
        ambientEnabled = true;  
          
        const ambientGain = audioCtx.createGain();  
        ambientGain.gain.value = 0;  
        ambientGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 3);  
        ambientGain.connect(masterGain);  
          
        // Deep bass drone  
        const bassOsc = audioCtx.createOscillator();  
        bassOsc.type = 'sine';  
        bassOsc.frequency.value = 30;  
        const bassGain = audioCtx.createGain();  
        bassGain.gain.value = 0.4;  
        bassOsc.connect(bassGain);  
        bassGain.connect(ambientGain);  
        bassOsc.start();  
          
        // Slow LFO on bass  
        const bassLfo = audioCtx.createOscillator();  
        bassLfo.frequency.value = 0.05;  
        const bassLfoGain = audioCtx.createGain();  
        bassLfoGain.gain.value = 5;  
        bassLfo.connect(bassLfoGain);  
        bassLfoGain.connect(bassOsc.frequency);  
        bassLfo.start();  
          
        // Mid harmonic pad  
        const padFreqs = [55, 82.5, 110, 165];  
        const padOscs = padFreqs.map(f => {  
            const osc = audioCtx.createOscillator();  
            osc.type = 'sine';  
            osc.frequency.value = f;  
            const g = audioCtx.createGain();  
            g.gain.value = 0.08;  
            osc.connect(g);  
            g.connect(ambientGain);  
              
            // Gentle frequency wobble  
            const lfo = audioCtx.createOscillator();  
            lfo.frequency.value = 0.02 + Math.random() * 0.05;  
            const lfoG = audioCtx.createGain();  
            lfoG.gain.value = 0.5;  
            lfo.connect(lfoG);  
            lfoG.connect(osc.frequency);  
            lfo.start();  
            osc.start();  
            return { osc, g, lfo, lfoG };  
        });  
          
        // Filtered noise - cosmic wind  
        const noiseSize = audioCtx.sampleRate * 4;  
        const noiseBuffer = audioCtx.createBuffer(1, noiseSize, audioCtx.sampleRate);  
        const noiseData = noiseBuffer.getChannelData(0);  
        for (let i = 0; i < noiseSize; i++) {  
            noiseData[i] = (Math.random() * 2 - 1) * 0.5;  
        }  
        const noise = audioCtx.createBufferSource();  
        noise.buffer = noiseBuffer;  
        noise.loop = true;  
          
        const noiseFilter = audioCtx.createBiquadFilter();  
        noiseFilter.type = 'bandpass';  
        noiseFilter.frequency.value = 200;  
        noiseFilter.Q.value = 0.5;  
          
        // Sweep the filter  
        const filterLfo = audioCtx.createOscillator();  
        filterLfo.frequency.value = 0.03;  
        const filterLfoGain = audioCtx.createGain();  
        filterLfoGain.gain.value = 150;  
        filterLfo.connect(filterLfoGain);  
        filterLfoGain.connect(noiseFilter.frequency);  
        filterLfo.start();  
          
        const noiseGain = audioCtx.createGain();  
        noiseGain.gain.value = 0.06;  
        noise.connect(noiseFilter);  
        noiseFilter.connect(noiseGain);  
        noiseGain.connect(ambientGain);  
        noise.start();  
          
        // High ethereal tones - random shimmering  
        const shimmerGain = audioCtx.createGain();  
        shimmerGain.gain.value = 0.03;  
        shimmerGain.connect(ambientGain);  
          
        function createShimmer() {  
            if (!ambientEnabled) return;  
            const osc = audioCtx.createOscillator();  
            osc.type = 'sine';  
            const baseFreq = 400 + Math.random() * 2000;  
            osc.frequency.value = baseFreq;  
            const g = audioCtx.createGain();  
            const dur = 3 + Math.random() * 8;  
            g.gain.setValueAtTime(0, audioCtx.currentTime);  
            g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + dur * 0.3);  
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);  
            osc.connect(g);  
            g.connect(shimmerGain);  
            osc.start();  
            osc.stop(audioCtx.currentTime + dur);  
            setTimeout(createShimmer, (2000 + Math.random() * 6000));  
        }  
        createShimmer();  
          
        // Reverb simulation using delay  
        const delay1 = audioCtx.createDelay();  
        delay1.delayTime.value = 0.3;  
        const delay1Gain = audioCtx.createGain();  
        delay1Gain.gain.value = 0.3;  
        const delay2 = audioCtx.createDelay();  
        delay2.delayTime.value = 0.7;  
        const delay2Gain = audioCtx.createGain();  
        delay2Gain.gain.value = 0.2;  
          
        ambientGain.connect(delay1);  
        delay1.connect(delay1Gain);  
        delay1Gain.connect(ambientGain);  
        ambientGain.connect(delay2);  
        delay2.connect(delay2Gain);  
        delay2Gain.connect(ambientGain);  
          
        ambientNodes = { ambientGain, bassOsc, bassLfo, bassGain, bassLfoGain, padOscs, noise, noiseFilter, noiseGain, filterLfo, filterLfoGain, shimmerGain, delay1, delay1Gain, delay2, delay2Gain };  
          
        document.getElementById('ambient-toggle').textContent = '🔇 Stop Ambient';  
        showNowPlaying('Deep Space Ambient');  
    }

    function stopAmbient() {  
        ambientEnabled = false;  
        if (ambientNodes.ambientGain) {  
            try {  
                ambientNodes.ambientGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);  
                setTimeout(() => {  
                    try {  
                        ambientNodes.bassOsc?.stop();  
                        ambientNodes.bassLfo?.stop();  
                        ambientNodes.noise?.stop();  
                        ambientNodes.filterLfo?.stop();  
                        ambientNodes.padOscs?.forEach(p => { p.osc.stop(); p.lfo.stop(); });  
                    } catch(e) {}  
                }, 1100);  
            } catch(e) {}  
        }  
        ambientNodes = [];  
        document.getElementById('ambient-toggle').textContent = '🎵 Space Ambient';  
    }

    // Planet-specific music definitions  
    const planetMusicDefs = {  
        'Sun': {  
            name: 'Solar Forge',  
            baseFreq: 55,  
            scale: [0, 3, 5, 7, 10, 12], // minor pentatonic  
            tempo: 0.8,  
            style: 'drone', // massive deep drone with crackling  
            color: '#ff6600'  
        },  
        'Mercury': {  
            name: 'Swift Messenger',  
            baseFreq: 440,  
            scale: [0, 2, 4, 5, 7, 9, 11], // major  
            tempo: 3.5,  
            style: 'fast-arpeggios',  
            color: '#b0b0b0'  
        },  
        'Venus': {  
            name: 'Veiled Beauty',  
            baseFreq: 220,  
            scale: [0, 2, 3, 5, 7, 8, 10], // natural minor  
            tempo: 1.2,  
            style: 'lush-pad',  
            color: '#ffcc66'  
        },  
        'Earth': {  
            name: 'Blue Marble',  
            baseFreq: 261.63,  
            scale: [0, 2, 4, 5, 7, 9, 11], // C major  
            tempo: 1.5,  
            style: 'melodic',  
            color: '#4488ff'  
        },  
        'Mars': {  
            name: 'Red Desert',  
            baseFreq: 146.83,  
            scale: [0, 1, 4, 5, 7, 8, 10], // phrygian  
            tempo: 1.0,  
            style: 'martial',  
            color: '#ff4422'  
        },  
        'Jupiter': {  
            name: 'King of Worlds',  
            baseFreq: 82.41,  
            scale: [0, 2, 4, 7, 9], // major pentatonic  
            tempo: 0.6,  
            style: 'majestic',  
            color: '#dd9955'  
        },  
        'Saturn': {  
            name: 'Ringed Sovereign',  
            baseFreq: 110,  
            scale: [0, 2, 3, 5, 7, 9, 10], // dorian  
            tempo: 0.7,  
            style: 'ethereal',  
            color: '#ccbb77'  
        },  
        'Uranus': {  
            name: 'Ice Giant Dreams',  
            baseFreq: 196,  
            scale: [0, 1, 3, 5, 6, 8, 10], // locrian  
            tempo: 0.9,  
            style: 'glitch',  
            color: '#66ccdd'  
        },  
        'Neptune': {  
            name: 'Deep Blue Abyss',  
            baseFreq: 164.81,  
            scale: [0, 2, 3, 6, 7, 8, 11], // harmonic minor-ish  
            tempo: 0.5,  
            style: 'oceanic',  
            color: '#3355ff'  
        },  
        'Pluto': {  
            name: 'Frozen Exile',  
            baseFreq: 130.81,  
            scale: [0, 1, 3, 4, 6, 7, 9, 10], // diminished  
            tempo: 0.4,  
            style: 'frozen',  
            color: '#998877'  
        }  
    };

    function getFreqFromScale(def, degree) {  
        const octave = Math.floor(degree / def.scale.length);  
        const idx = ((degree % def.scale.length) + def.scale.length) % def.scale.length;  
        return def.baseFreq * Math.pow(2, (def.scale[idx] + octave * 12) / 12);  
    }

    function startPlanetMusic(planetName) {  
        if (!audioCtx) initAudio();  
        stopPlanetMusic();  
          
        const def = planetMusicDefs[planetName];  
        if (!def) return;  
          
        planetMusicEnabled = true;  
        currentPlanetMusic = planetName;  
          
        const mainGain = audioCtx.createGain();  
        mainGain.gain.value = 0;  
        mainGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 2);  
        mainGain.connect(masterGain);  
          
        // Reverb-like delay  
        const delay = audioCtx.createDelay();  
        delay.delayTime.value = 0.4;  
        const delayGain = audioCtx.createGain();  
        delayGain.gain.value = 0.25;  
        const delay2 = audioCtx.createDelay();  
        delay2.delayTime.value = 0.8;  
        const delay2Gain = audioCtx.createGain();  
        delay2Gain.gain.value = 0.15;  
        mainGain.connect(delay);  
        delay.connect(delayGain);  
        delayGain.connect(mainGain);  
        mainGain.connect(delay2);  
        delay2.connect(delay2Gain);  
        delay2Gain.connect(mainGain);  
          
        const nodes = { mainGain, delay, delayGain, delay2, delay2Gain, intervals: [], oscs: [] };  
          
        switch(def.style) {  
            case 'drone': createSunMusic(def, mainGain, nodes); break;  
            case 'fast-arpeggios': createMercuryMusic(def, mainGain, nodes); break;  
            case 'lush-pad': createVenusMusic(def, mainGain, nodes); break;  
            case 'melodic': createEarthMusic(def, mainGain, nodes); break;  
            case 'martial': createMarsMusic(def, mainGain, nodes); break;  
            case 'majestic': createJupiterMusic(def, mainGain, nodes); break;  
            case 'ethereal': createSaturnMusic(def, mainGain, nodes); break;  
            case 'glitch': createUranusMusic(def, mainGain, nodes); break;  
            case 'oceanic': createNeptuneMusic(def, mainGain, nodes); break;  
            case 'frozen': createPlutoMusic(def, mainGain, nodes); break;  
        }  
          
        planetMusicNodes = nodes;  
        document.getElementById('music-toggle').textContent = '🔇 Stop Music';  
        showNowPlaying(def.name + ' — ' + planetName);  
    }

    function createSunMusic(def, output, nodes) {  
        // Massive drone with overtones and crackling  
        [1, 1.5, 2, 3, 4, 5].forEach((mult, i) => {  
            const osc = audioCtx.createOscillator();  
            osc.type = i < 2 ? 'sawtooth' : 'sine';  
            osc.frequency.value = def.baseFreq * mult;  
            const g = audioCtx.createGain();  
            g.gain.value = 0.15 / (i + 1);  
            osc.connect(g);  
            g.connect(output);  
              
            const lfo = audioCtx.createOscillator();  
            lfo.frequency.value = 0.1 + Math.random() * 0.3;  
            const lfoG = audioCtx.createGain();  
            lfoG.gain.value = mult * 2;  
            lfo.connect(lfoG);  
            lfoG.connect(osc.frequency);  
            lfo.start();  
            osc.start();  
            nodes.oscs.push(osc, lfo);  
        });  
          
        // Solar crackle  
        function crackle() {  
            if (!planetMusicEnabled || currentPlanetMusic !== 'Sun') return;  
            const osc = audioCtx.createOscillator();  
            osc.type = 'square';  
            osc.frequency.value = 2000 + Math.random() * 5000;  
            const g = audioCtx.createGain();  
            const t = audioCtx.currentTime;  
            g.gain.setValueAtTime(0.02, t);  
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);  
            osc.connect(g);  
            g.connect(output);  
            osc.start(t);  
            osc.stop(t + 0.05);  
            setTimeout(crackle, 50 + Math.random() * 300);  
        }  
        crackle();  
          
        // Low rumble pulse  
        const rumbleInt = setInterval(() => {  
            if (!planetMusicEnabled) return;  
            const osc = audioCtx.createOscillator();  
            osc.type = 'sine';  
            osc.frequency.value = 20 + Math.random() * 30;  
            const g = audioCtx.createGain();  
            const t = audioCtx.currentTime;  
            g.gain.setValueAtTime(0, t);  
            g.gain.linearRampToValueAtTime(0.2, t + 1);  
            g.gain.linearRampToValueAtTime(0, t + 3);  
            osc.connect(g);  
            g.connect(output);  
            osc.start(t);  
            osc.stop(t + 3);  
        }, 3000);  
        nodes.intervals.push(rumbleInt);  
    }

    function createMercuryMusic(def, output, nodes) {  
        // Fast, playful arpeggios - quick and nimble like Mercury  
        let step = 0;  
        const arpInt = setInterval(() => {  
            if (!planetMusicEnabled) return;  
            const freq = getFreqFromScale(def, step);  
            const osc = audioCtx.createOscillator();  
            osc.type = step % 3 === 0 ? 'triangle' : 'sine';  
            osc.frequency.value = freq;  
            const g = audioCtx.createGain();  
            const t = audioCtx.currentTime;  
            g.gain.setValueAtTime(0.15, t);  
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);  
            osc.connect(g);  
            g.connect(output);  
            osc.start(t);  
            osc.stop(t + 0.15);  
            step = (step + 1) % 12;  
              
            // Occasional quick trill  
            if (Math.random() < 0.2) {  
                setTimeout(() => {  
                    if (!planetMusicEnabled) return;  
                    const o2 = audioCtx.createOscillator();  
                    o2.type = 'sine';  
                    o2.frequency.value = freq * 2;  
                    const g2 = audioCtx.createGain();  
                    const t2 = audioCtx.currentTime;  
                    g2.gain.setValueAtTime(0.08, t2);  
                    g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.08);  
                    o2.connect(g2);  
                    g2.connect(output);  
                    o2.start(t2);  
                    o2.stop(t2 + 0.08);  
                }, 60);  
            }  
        }, 120);  
        nodes.intervals.push(arpInt);  
          
        // Light metallic percussion  
        const percInt = setInterval(() => {  
            if (!planetMusicEnabled) return;  
            const osc = audioCtx.createOscillator();  
            osc.type = 'square';  
            osc.frequency.value = 800 + Math.random() * 2000;  
            const g = audioCtx.createGain();  
            const t = audioCtx.currentTime;  
            g.gain.setValueAtTime(0.03, t);  
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);  
            osc.connect(g);  
            g.connect(output);  
            osc.start(t);  
            osc.stop(t + 0.03);  
        }, 240);  
        nodes.intervals.push(percInt);  
    }

    function createVenusMusic(def, output, nodes) {  
        // Lush, warm pads with gentle movement - romantic and mysterious  
        const padNotes = [0, 3, 5, 7, 10];  
        padNotes.forEach((note, i) => {  
            const freq = getFreqFromScale(def, note > 4 ? note - def.scale.length : note);  
            // Use base freq directly for pads  
            const f = def.baseFreq * Math.pow(2, def.scale[note % def.scale.length] / 12);  
            const osc = audioCtx.createOscillator();  
            osc.type = 'sine';  
            osc.frequency.value = f;  
            const osc2 = audioCtx.createOscillator();  
            osc2.type = 'triangle';

    function stopPlanetMusic() {  
        planetMusicEnabled = false;  
        currentPlanetMusic = null;  
        if (planetMusicNodes.mainGain) {  
            try {  
                planetMusicNodes.mainGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);  
                planetMusicNodes.intervals?.forEach(i => clearInterval(i));  
                setTimeout(() => {  
                    try {  
                        planetMusicNodes.oscs?.forEach(o => { try { o.stop(); } catch(e){} });  
                    } catch(e) {}  
                }, 1100);  
            } catch(e) {}

    // ============ 3D MATH ============  
    function mat4Multiply(a, b) {  
        const r = new Float32Array(16);  
        for (let i = 0; i < 4; i++)  
            for (let j = 0; j < 4; j++)  
                for (let k = 0; k < 4; k++)  
                    r[i*4+j] += a[i*4+k] * b[k*4+j];  
        return r;  
    }

    function mat4RotateX(a) {  
        const c = Math.cos(a), s = Math.sin(a);  
        return new Float32Array([1,0,0,0, 0,c,s,0, 0,-s,c,0, 0,0,0,1]);  
    }

    function mat4RotateY(a) {  
        const c = Math.cos(a), s = Math.sin(a);  
        return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);  
    }

    function transformPoint(m, p) {  
        return [  
            m[0]*p[0]+m[1]*p[1]+m[2]*p[2]+m[3],  
            m[4]*p[0]+m[5]*p[1]+m[6]*p[2]+m[7],  
            m[8]*p[0]+m[9]*p[1]+m[10]*p[2]+m[11]  
        ];  
    }

    function project(p) {  
        const fov = 600;  
        const z = p[2] + camera.dist;  
        if (z <= 0.1) return null;  
        return [W/2 + p[0]*fov/z, H/2 + p[1]*fov/z, z];  
    }

    const camera = {

    };

    let isDragging = false;  
    let lastMouse = { x: 0, y: 0 };  
    let focusedPlanet = null;

    canvas.addEventListener('mousedown', e => {  
        isDragging = true;  
        lastMouse = { x: e.clientX, y: e.clientY };  
    });

    canvas.addEventListener('mousemove', e => {  
        if (isDragging) {  
            const dx = e.clientX - lastMouse.x;  
            const dy = e.clientY - lastMouse.y;  
            camera.targetRotY += dx * 0.005;  
            camera.targetRotX = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camera.targetRotX + dy * 0.005));  
            lastMouse = { x: e.clientX, y: e.clientY };  
        }  
    });

    canvas.addEventListener('mouseup', () => isDragging = false);  
    canvas.addEventListener('mouseleave', () => isDragging = false);

    canvas.addEventListener('wheel', e => {  
        camera.targetDist *= e.deltaY > 0 ? 1.1 : 0.9;  
        camera.targetDist = Math.max(20, Math.min(3000, camera.targetDist));  
    });

    canvas.addEventListener('click', e => {  
        if (Math.abs(e.clientX - lastMouse.x) > 5 || Math.abs(e.clientY - lastMouse.y) > 5) return;  
          
        const viewMat = mat4Multiply(mat4RotateX(camera.rotX), mat4RotateY(camera.rotY));  
        let closest = null;  
        let closestDist = Infinity;  
          
        planets.forEach(p => {  
            const pos = [p.worldX - camera.focusX, p.worldY - camera.focusY, p.worldZ - camera.focusZ];  
            const tp = transformPoint(viewMat, pos);  
            const sp = project(tp);  
            if (!sp) return;  
            const dx = e.clientX - sp[0];  
            const dy = e.clientY - sp[1];  
            const d = Math.sqrt(dx*dx + dy*dy);  
            const screenRadius = Math.max(8, p.radius * 600 / sp[2]);  
            if (d < screenRadius + 15 && d < closestDist) {  
                closest = p;  
                closestDist = d;  
            }  
        });  
          
        if (closest) {  
            focusedPlanet = closest;  
            camera.targetDist = closest.radius * 8 + 20;  
              
            // Auto-start planet music on click  
            if (audioCtx || true) {  
                initAudio();  
                startPlanetMusic(closest.name);  
            }  
              
            showPlanetInfo(closest);  
        }  
    });

    function noise2D(x, y, seed) {  
        const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;  
        return n - Math.floor(n);  
    }

    function fbm(x, y, seed, octaves = 5) {  
        let v = 0, a = 0.5, f = 1;  
        for (let i = 0; i < octaves; i++) {  
            v += a * noise2D(x * f, y * f, seed + i * 100);  
            a *= 0.5;  
            f *= 2;  
        }  
        return v;  
    }

    // ============ RENDER SPHERE ============  
    function renderSphere(x, y, z, radius, texture, rotation, planet) {  
        const viewMat = mat4Multiply(mat4RotateX(camera.rotX), mat4RotateY(camera.rotY));  
        const pos = transformPoint(viewMat, [x - camera.focusX, y - camera.focusY, z - camera.focusZ]);  
        const sp = project(pos);  
        if (!sp) return;  
          
        const screenRadius = radius * 600 / sp[2];  
        if (screenRadius < 0.5) return;  
          
        // Store screen position for click detection  
        if (planet) {  
            planet.screenX = sp[0];  
            planet.screenY = sp[1];  
            planet.screenRadius = screenRadius;  
            planet.depth = sp[2];  
        }  
          
        // Glow effect for Sun  
        if (planet && planet.emissive) {  
            const glowR = screenRadius + planet.glowSize * (600 / sp[2]);  
            const glow = ctx.createRadialGradient(sp[0], sp[1], screenRadius * 0.5, sp[0], sp[1], glowR);  
            glow.addColorStop(0, 'rgba(255,150,50,0.4)');  
            glow.addColorStop(0.3, 'rgba(255,100,20,0.2)');  
            glow.addColorStop(0.6, 'rgba(255,50,0,0.05)');  
            glow.addColorStop(1, 'rgba(255,50,0,0)');  
            ctx.beginPath();  
            ctx.arc(sp[0], sp[1], glowR, 0, Math.PI * 2);  
            ctx.fillStyle = glow;  
            ctx.fill();  
              
            // Corona rays  
            ctx.save();  
            ctx.translate(sp[0], sp[1]);  
            for (let i = 0; i < 12; i++) {  
                const angle = (i / 12) * Math.PI * 2 + performance.now() * 0.0003;  
                const len = glowR * (0.8 + Math.sin(performance.now() * 0.002 + i) * 0.3);  
                ctx.beginPath();  
                ctx.moveTo(Math.cos(angle) * screenRadius, Math.sin(angle) * screenRadius);  
                ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);  
                ctx.strokeStyle = `rgba(255,200,50,${0.05 + Math.sin(performance.now()*0.003+i)*0.03})`;  
                ctx.lineWidth = 2;  
                ctx.stroke();  
            }  
            ctx.restore();  
        }  
          
        if (screenRadius > 2) {  
            // Draw textured sphere using circular clip  
            ctx.save();  
            ctx.beginPath();  
            ctx.arc(sp[0], sp[1], screenRadius, 0, Math.PI * 2);  
            ctx.clip();  
              
            // Draw texture with rotation  
            const texW = screenRadius * 4;  
            const texH = screenRadius * 2;  
            const offsetX = (rotation % (Math.PI * 2)) / (Math.PI * 2) * texW;  
              
            // Draw texture twice for seamless wrapping  
            ctx.drawImage(texture, sp[0] - screenRadius - offsetX, sp[1] - screenRadius, texW, screenRadius * 2);  
            ctx.drawImage(texture, sp[0] - screenRadius - offsetX + texW, sp[1] - screenRadius, texW, screenRadius * 2);  
              
            // 3D shading  
            if (!planet?.emissive) {  
                const lightDir = transformPoint(viewMat, [-camera.focusX, -camera.focusY, -camera.focusZ]);  
                const shade = ctx.createRadialGradient(  
                    sp[0] - screenRadius * 0.3, sp[1] - screenRadius * 0.3, 0,  
                    sp[0], sp[1], screenRadius  
                );  
                shade.addColorStop(0, 'rgba(255,255,255,0.15)');  
                shade.addColorStop(0.5, 'rgba(0,0,0,0)');  
                shade.addColorStop(0.8, 'rgba(0,0,0,0.4)');  
                shade.addColorStop(1, 'rgba(0,0,0,0.7)');  
                ctx.fillStyle = shade;  
                ctx.fillRect(sp[0] - screenRadius, sp[1] - screenRadius, screenRadius * 2, screenRadius * 2);  
            }  
              
            ctx.restore();  
              
            // Atmosphere glow  
            if (planet?.atmosphere) {  
                ctx.beginPath();  
                ctx.arc(sp[0], sp[1], screenRadius + 3, 0, Math.PI * 2);  
                ctx.strokeStyle = planet.atmosphere;  
                ctx.lineWidth = 3;  
                ctx.stroke();  
            }  
        } else {  
            // Too small, draw as dot  
            ctx.beginPath();  
            ctx.arc(sp[0], sp[1], Math.max(2, screenRadius), 0, Math.PI * 2);  
            ctx.fillStyle = planet?.emissive ? '#ff8800' : '#aaaacc';  
            ctx.fill();  
        }  
          
        // Planet name label  
        if (screenRadius > 3 && sp[2] > 0) {  
            ctx.fillStyle = 'rgba(255,255,255,0.7)';  
            ctx.font = `${Math.min(14, Math.max(10, screenRadius * 0.5))}px 'Segoe UI'`;  
            ctx.textAlign = 'center';  
            ctx.fillText(planet?.name || '', sp[0], sp[1] - screenRadius - 8);  
        }  
    }

    // ============ RENDER RINGS ============  
    function renderRings(x, y, z, planet) {  
        const viewMat = mat4Multiply(mat4RotateX(camera.rotX), mat4RotateY(camera.rotY));  
        const segments = 80;  
          
        for (let r = planet.ringInner; r <= planet.ringOuter; r += (planet.thinRings ? 2 : 0.8)) {  
            ctx.beginPath();  
            let first = true;  
            for (let i = 0; i <= segments; i++) {  
                const a = (i / segments) * Math.PI * 2;  
                const rx = x + Math.cos(a) * r;  
                const ry = y;  
                const rz = z + Math.sin(a) * r;  
                const pos = transformPoint(viewMat, [rx - camera.focusX, ry - camera.focusY, rz - camera.focusZ]);  
                const sp = project(pos);  
                if (!sp) continue;  
                if (first) { ctx.moveTo(sp[0], sp[1]); first = false; }  
                else ctx.lineTo(sp[0], sp[1]);  
            }  
            const ringAlpha = planet.thinRings ? 0.15 : (0.4 - (r - planet.ringInner) / (planet.ringOuter - planet.ringInner) * 0.3);  
            if (planet.name === 'Saturn') {  
                const hue = 40 + (r - planet.ringInner) * 2;  
                ctx.strokeStyle = `hsla(${hue}, 30%, 70%, ${ringAlpha})`;  
            } else {  
                ctx.strokeStyle = `rgba(180,200,220,${ringAlpha})`;  
            }  
            ctx.lineWidth = planet.thinRings ? 0.5 : 1.5;  
            ctx.stroke();  
        }  
    }

    // ============ RENDER ORBIT PATH ============  
    function renderOrbit(distance, inclination = 0) {  
        const viewMat = mat4Multiply(mat4RotateX(camera.rotX), mat4RotateY(camera.rotY));  
        const segments = 100;  
        ctx.beginPath();  
        let first = true;  
        for (let i = 0; i <= segments; i++) {  
            const a = (i / segments) * Math.PI * 2;  
            const ox = Math.cos(a) * distance;  
            const oy = Math.sin(a) * distance * Math.sin(inclination || 0);  
            const oz = Math.sin(a) * distance * Math.cos(inclination || 0);  
            const pos = transformPoint(viewMat, [ox - camera.focusX, oy - camera.focusY, oz - camera.focusZ]);  
            const sp = project(pos);  
            if (!sp) continue;  
            if (first) { ctx.moveTo(sp[0], sp[1]); first = false; }  
            else ctx.lineTo(sp[0], sp[1]);  
        }  
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';  
        ctx.lineWidth = 0.5;  
        ctx.stroke();  
    }

    // ============ ASTEROID BELT ============  
    const asteroids = [];  
    for (let i = 0; i < 300; i++) {  
        const a = Math.random() * Math.PI * 2;  
        const r = 195 + (Math.random() - 0.5) * 20;  
        asteroids.push({  
            angle: a, dist: r,  
            speed: 0.015 + (Math.random() - 0.5) * 0.003,  
            y: (Math.random() - 0.5) * 8,  
            size: 0.5 + Math.random() * 1  
        });  
    }

    // ============ MAIN LOOP ============  
    let speedMultiplier = 1;  
    let time = 0;

    document.getElementById('speed-control').addEventListener('input', e => {  
        speedMultiplier = parseFloat(e.target.value);  
        document.getElementById('speed-val').textContent = speedMultiplier.toFixed(1) + 'x';  
    });

    function animate() {  
        requestAnimationFrame(animate);  
          
        time += 0.016 * speedMultiplier;  
          
        // Smooth camera  
        camera.rotX += (camera.targetRotX - camera.rotX) * 0.08;  
        camera.rotY += (camera.targetRotY - camera.rotY) * 0.08;  
        camera.dist += (camera.targetDist - camera.dist) * 0.06;  
        camera.focusX += (camera.targetFocusX - camera.focusX) * 0.06;  
        camera.focusY += (camera.targetFocusY - camera.focusY) * 0.06;  
        camera.focusZ += (camera.targetFocusZ - camera.focusZ) * 0.06;  
          
        // Update planet positions  
        planets.forEach(p => {  
            if (p.distance > 0) {  
                p.angle += p.speed * speedMultiplier * 0.016;  
                const inclination = p.orbitalInclination || 0;  
                p.worldX = Math.cos(p.angle) * p.distance;  
                p.worldY = Math.sin(p.angle) * p.distance * Math.sin(inclination);  
                p.worldZ = Math.sin(p.angle) * p.distance * Math.cos(inclination);  
            } else {  
                p.worldX = p.worldY = p.worldZ = 0;  
            }  
            p.rotation = (p.rotation || 0) + (p.rotationSpeed || 0.01) * speedMultiplier;  
        });  
          
        // Focus on planet  
        if (focusedPlanet) {  
            camera.targetFocusX = focusedPlanet.worldX;  
            camera.targetFocusY = focusedPlanet.worldY;  
            camera.targetFocusZ = focusedPlanet.worldZ;  
        }  
          
        // Clear  
        ctx.fillStyle = '#000005';  
        ctx.fillRect(0, 0, W, H);  
          
        // Subtle nebula background  
        const t = performance.now() * 0.0001;  
        const nebGrad = ctx.createRadialGradient(W*0.3, H*0.4, 0, W*0.3, H*0.4, W*0.6);  
        nebGrad.addColorStop(0, `rgba(20,10,40,${0.15 + Math.sin(t) * 0.05})`);  
        nebGrad.addColorStop(0.5, `rgba(10,5,30,${0.1 + Math.sin(t+1) * 0.03})`);  
        nebGrad.addColorStop(1, 'rgba(0,0,0,0)');  
        ctx.fillStyle = nebGrad;  
        ctx.fillRect(0, 0, W, H);  
          
        const nebGrad2 = ctx.createRadialGradient(W*0.7, H*0.6, 0, W*0.7, H*0.6, W*0.5);  
        nebGrad2.addColorStop(0, `rgba(30,10,15,${0.1 + Math.sin(t*1.3+2) * 0.04})`);  
        nebGrad2.addColorStop(1, 'rgba(0,0,0,0)');  
        ctx.fillStyle = nebGrad2;  
        ctx.fillRect(0, 0, W, H);  
          
        // Stars  
        const viewMat = mat4Multiply(mat4RotateX(camera.rotX), mat4RotateY(camera.rotY));  
        stars.forEach(s => {  
            const pos = transformPoint(viewMat, [s.x, s.y, s.z]);  
            const sp = project(pos);  
            if (!sp || sp[2] < 0) return;  
            const twinkle = 0.6 + 0.4 * Math.sin(performance.now() * 0.001 * s.twinkleSpeed + s.x);  
            const alpha = s.brightness * twinkle;  
            ctx.beginPath();  
            ctx.arc(sp[0], sp[1], s.size * (600 / sp[2]) * 2, 0, Math.PI * 2);  
            ctx.fillStyle = s.color;  
            ctx.globalAlpha = alpha;  
            ctx.fill();  
            ctx.globalAlpha = 1;  
        });  
          
        // Orbit paths  
        planets.forEach(p => {  
            if (p.distance > 0) renderOrbit(p.distance, p.orbitalInclination);  
        });  
          
        // Asteroids  
        asteroids.forEach(a => {  
            a.angle += a.speed * speedMultiplier * 0.016;  
            const ax = Math.cos(a.angle) * a.dist;  
            const az = Math.sin(a.angle) * a.dist;  
            const pos = transformPoint(viewMat, [ax - camera.focusX, a.y - camera.focusY, az - camera.focusZ]);  
            const sp = project(pos);  
            if (!sp) return;  
            const size = a.size * 600 / sp[2];  
            if (size < 0.3) return;  
            ctx.beginPath();  
            ctx.arc(sp[0], sp[1], Math.max(0.5, size), 0, Math.PI * 2);  
            ctx.fillStyle = `rgba(150,140,130,${Math.min(1, size)})`;  
            ctx.fill();  
        });  
          
        // Sort planets by depth for correct rendering  
        const sorted = [...planets].map((p, i) => ({...p, idx: i}));  
        sorted.sort((a, b) => {  
            const posA = transformPoint(viewMat, [a.worldX - camera.focusX, a.worldY - camera.focusY, a.worldZ - camera.focusZ]);  
            const posB = transformPoint(viewMat, [b.worldX - camera.focusX, b.worldY - camera.focusY, b.worldZ - camera.focusZ]);  
            return (posB[2] + camera.dist) - (posA[2] + camera.dist);  
        });  
          
        // Render planets  
        sorted.forEach(p => {  
            const planet = planets[p.idx];  
              
            // Rings behind planet  
            if (planet.hasRings) {  
                renderRings(planet.worldX, planet.worldY, planet.worldZ, planet);  
            }  
              
            renderSphere(planet.worldX, planet.worldY, planet.worldZ, planet.radius, planet.texture, planet.rotation, planet);  
              
            // Earth's moon  
            if (planet.hasMoon) {  
                const moonAngle = time * planet.moonSpeed;  
                const mx = planet.worldX + Math.cos(moonAngle) * planet.moonDist;  
                const mz = planet.worldZ + Math.sin(moonAngle) * planet.moonDist;  
                const my = planet.worldY + Math.sin(moonAngle * 0.5) * 2;  
                  
                const moonPos = transformPoint(viewMat, [mx - camera.focusX, my - camera.focusY, mz - camera.focusZ]);  
                const moonSp = project(moonPos);  
                if (moonSp) {  
                    const moonSR = planet.moonRadius * 600 / moonSp[2];  
                    if (moonSR > 0.5) {  
                        ctx.beginPath();  
                        ctx.arc(moonSp[0], moonSp[1], moonSR, 0, Math.PI * 2);  
                        const moonGrad = ctx.createRadialGradient(  
                            moonSp[0] - moonSR * 0.3, moonSp[1] - moonSR * 0.3, 0,  
                            moonSp[0], moonSp[1], moonSR  
                        );  
                        moonGrad.addColorStop(0, '#ddd');  
                        moonGrad.addColorStop(0.7, '#999');  
                        moonGrad.addColorStop(1, '#555');  
                        ctx.fillStyle = moonGrad;  
                        ctx.fill();  
                    }  
                }  
            }  
        });  
          
        // Draw visualizer  
        if (analyser && (ambientEnabled || planetMusicEnabled)) {  
            analyser.getByteFrequencyData(analyserData);  
            vizCtx.clearRect(0, 0, W, 40);  
            const barWidth = W / analyserData.length;  
            for (let i = 0; i < analyserData.length; i++) {  
                const h = (analyserData[i] / 255) * 35;  
                const hue = 220 + (i / analyserData.length) * 60;  
                vizCtx.fillStyle = `hsla(${hue}, 60%, 60%, ${0.3 + h/35 * 0.4})`;  
                vizCtx.fillRect(i * barWidth, 40 - h, barWidth - 1, h);  
            }  
        }  
    }  
      
    animate();  
    </script>  
</body>  
</html>
