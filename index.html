function anim(){requestAnimationFrame(anim);var t=clk.getElapsedTime();if(autoRot)tTheta+=.0008;uCam();fL.intensity+=(tgF-fL.intensity)*.08;cF.intensity+=(tgF*.4-cF.intensity)*.08;  
    M.forEach(function(m,i){var d=DATA[i];m.userData.angle+=d.spd*.004*spdMul;if(d.orbit>0){m.position.x=Math.cos(m.userData.angle)*d.orbit;m.position.z=Math.sin(m.userData.angle)*d.orbit}m.rotation.y+=(d.name==='Sun'?.001:.004)*spdMul;if(d.name==='Uranus')m.rotation.z=1.71;else if(d.name==='Earth')m.rotation.z=.41;  
        if(d.name==='Sun'){sL.position.copy(m.position);sL2.position.copy(m.position);if(m.userData.g1)m.userData.g1.material.uniforms.time.value=t;if(m.userData.g2)m.userData.g2.material.uniforms.time.value=t}  
        if(m.userData.cl)m.userData.cl.rotation.y+=.0005*spdMul;  
        if(m.userData.mn){var a=t*.6;m.userData.mn.position.set(m.position.x+Math.cos(a)*2,Math.sin(a*.4)*.3,m.position.z+Math.sin(a)*2)}  
        if(m.userData.jm)m.userData.jm.forEach(function(mm,j){var a2=t*(.3+j*.15)+j*1.57,md=4.5+j*1.2;mm.position.set(m.position.x+Math.cos(a2)*md,Math.sin(a2*.3+j)*.3,m.position.z+Math.sin(a2)*md)});  
        if(d.name!=='Sun'){if(selIdx===i){m.material.emissiveIntensity+=(.45-m.material.emissiveIntensity)*.08;var sp=M[0].position,ts=sp.clone().sub(m.position).normalize();fL.position.copy(m.position).sub(ts.multiplyScalar(d.r*4));fL.visible=true}else m.material.emissiveIntensity+=(m.userData.origEI-m.material.emissiveIntensity)*.05}  
        if(selIdx===i)tCamTarget.copy(m.position);  
        if(lb[i]){if(showLab){var p=m.position.clone();p.y+=d.r+.6;p.project(cam);lb[i].style.left=(p.x*.5+.5)*innerWidth+'px';lb[i].style.top=(-p.y*.5+.5)*innerHeight+'px';lb[i].style.opacity=p.z<1?'0.7':'0'}else lb[i].style.opacity='0'}});  
    oL.forEach(function(l){l.visible=showOrb});if(selIdx>=0)tgF=2.5;else{tgF=0;fL.visible=false}  
    if(!isDrag){rc.setFromCamera(ms,cam);var h=rc.intersectObjects(M);M.forEach(function(m){if(m.userData.data.name!=='Sun'&&selIdx!==m.userData.idx)m.material.emissiveIntensity=m.userData.origEI});if(h.length){var hm=h[0].object;if(hm.userData.data.name!=='Sun'&&selIdx!==hm.userData.idx)hm.material.emissiveIntensity=.2;R.domElement.style.cursor='pointer'}else R.domElement.style.cursor='grab'}  
    if(novaOn){var p2=Math.min((t-novaT)/3,1);window._nM.uniforms.time.value=t;window._nM.uniforms.progress.value=p2;window._nMe.visible=true;if(p2>=1){novaOn=false;window._nMe.visible=false}}  
    document.getElementById('zmV').textContent=(55/camDist).toFixed(1)+'x';R.render(S,cam)}

function selPlanet(d,idx){selected=d;selIdx=idx;playClick();  
    var m=M[idx];tCamTarget.copy(m.position);tDist=d.r*6+2;tPhi=1.1;tTheta=Math.atan2(m.position.z,m.position.x)+.6;autoRot=false;  
    document.getElementById('focusName').textContent=d.name.toUpperCase();document.getElementById('focusName').style.opacity='1';  
    if(musOn)startPM(d.name);  
    var hc=document.getElementById('heroContent');hc.innerHTML='';  
    tryImg(photoUrls(d.name),function(u){hc.innerHTML='<img src="'+u+'">';},function(){var cv=document.createElement('canvas');renderFB(cv,TYPES[idx],840,400);hc.appendChild(cv)});  
    var pw=document.getElementById('piconWrap');pw.innerHTML='';  
    tryImg(photoUrls(d.name),function(u){pw.innerHTML='<img src="'+u+'">';},function(){var cv=document.createElement('canvas');renderFB(cv,TYPES[idx],120,120);pw.appendChild(cv)});  
    document.getElementById('pcred').textContent='NASA/JPL-Caltech';  
    document.getElementById('pnm').textContent=d.name;document.getElementById('pty').textContent=d.type;  
    document.getElementById('icard').style.setProperty('--ac',d.css);document.getElementById('icard').style.setProperty('--ac2',d.css+'44');  
    var sg=document.getElementById('pst');sg.innerHTML='';  
    Object.entries(d.stats).forEach(function(e){sg.innerHTML+='<div class="si"><div class="sl">'+e[0]+'</div><div class="sv">'+e[1]+'</div></div>'});  
    document.getElementById('pft').textContent=d.fact;  
    var mb=document.getElementById('pmb'),mt=document.getElementById('pmt');  
    if(d.moons.length){mb.style.display='block';mt.innerHTML=d.moons.map(function(m2){return'<span class="mg">'+m2+'</span>'}).join('')}else mb.style.display='none';  
    document.getElementById('musInfo').textContent=musOn&&PMUS[d.name]?'Playing: '+d.name+' theme':'';  
    document.getElementById('jokeText').textContent=getDailyJoke(d.name);  
    document.getElementById('extraFacts').innerHTML=getXFacts(d.name);  
    document.getElementById('ip').classList.add('open');  
    document.querySelectorAll('.pd').forEach(function(b,i){b.classList.toggle('sel',i===idx)})}

function closeInfo(){document.getElementById('ip').classList.remove('open');selected=null;selIdx=-1;document.querySelectorAll('.pd').forEach(function(b){b.classList.remove('sel')});document.getElementById('focusName').style.opacity='0';tgF=0;stopPM()}  
function togOrb(){showOrb=!showOrb;document.getElementById('bOrb').classList.toggle('on',showOrb)}  
function togLab(){showLab=!showLab;document.getElementById('bLab').classList.toggle('on',showLab)}  
function resetCam(){tCamTarget.set(0,0,0);tTheta=.4;tPhi=1.1;tDist=55;autoRot=true;closeInfo()}  
function doNova(){novaOn=true;novaT=clk.getElapsedTime();if(window._nMe)window._nMe.visible=true;playNova();document.body.style.filter='brightness(3)';setTimeout(function(){document.body.style.filter='brightness(1)'},100)}

function buildBar(){var bar=document.getElementById('pbar');DATA.forEach(function(d,i){var el=document.createElement('div');el.className='pd';el.style.setProperty('--c',d.css);el.innerHTML='<div class="pd-orb" style="background:radial-gradient(circle at 35% 35%,'+d.g[0]+','+d.g[1]+')"></div><div class="pd-name">'+d.name.toUpperCase()+'</div>';el.addEventListener('click',function(){selPlanet(d,i)});bar.appendChild(el)})}  
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});  
buildBar();init();  
</script>  
</body>  
</html>
