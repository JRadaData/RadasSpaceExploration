function photoUrls(n) {  
    var l = n.toLowerCase();  
    return ['photos/'+l+'.jpg','photos/'+l+'.png','photos/'+l+'.jpeg','photos/'+l+'.webp','photos/'+n+'.jpg','photos/'+n+'.png','photos/'+n+'.jpeg','photos/'+n+'.JPG'];  
}  
function tryImg(urls, ok, fail) {  
    var i = 0;  
    function next() {  
        if (i >= urls.length) { fail(); return; }  
        var img = new Image();  
        img.onload = function() { ok(urls[i]); };  
        img.onerror = function() { i++; next(); };  
        img.src = urls[i];  
    }  
    next();  
}

/* ========== PLUTO TEXTURE ========== */  
function genPlutoTex() {  
    var cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;  
    var cx = cv.getContext('2d');  
    var bg = cx.createLinearGradient(0,0,1024,512);  
    bg.addColorStop(0,'#c0a888'); bg.addColorStop(.3,'#b49878'); bg.addColorStop(.5,'#d0b898'); bg.addColorStop(.7,'#a88868'); bg.addColorStop(1,'#c4a880');  
    cx.fillStyle = bg; cx.fillRect(0,0,1024,512);  
    for (var i = 0; i < 5000; i++) { var x=Math.random()*1024,y=Math.random()*512,s=.5+Math.random()*3,v=Math.random(); cx.fillStyle='rgba('+(130+v*70)+','+(100+v*60)+','+(70+v*50)+','+(0.05+v*0.07)+')'; cx.beginPath(); cx.arc(x,y,s,0,6.28); cx.fill(); }  
    cx.fillStyle = 'rgba(60,45,30,.25)'; cx.beginPath(); cx.ellipse(200,280,120,60,.1,0,6.28); cx.fill();  
    cx.fillStyle = 'rgba(50,35,20,.2)'; cx.beginPath(); cx.ellipse(350,290,80,40,-.1,0,6.28); cx.fill();  
    cx.fillStyle = 'rgba(235,225,210,.35)';  
    var hx=500,hy=220,hs=80;  
    cx.beginPath(); cx.moveTo(hx,hy+hs*.3); cx.bezierCurveTo(hx,hy-hs*.4,hx-hs*1.1,hy-hs*.4,hx-hs*1.1,hy+hs*.1); cx.bezierCurveTo(hx-hs*1.1,hy+hs*.7,hx,hy+hs*.9,hx,hy+hs*1.1); cx.bezierCurveTo(hx,hy+hs*.9,hx+hs*1.1,hy+hs*.7,hx+hs*1.1,hy+hs*.1); cx.bezierCurveTo(hx+hs*1.1,hy-hs*.4,hx,hy-hs*.4,hx,hy+hs*.3); cx.fill();  
    cx.fillStyle = 'rgba(240,232,218,.2)'; cx.beginPath(); cx.ellipse(460,250,50,55,-.1,0,6.28); cx.fill();  
    cx.fillStyle = 'rgba(210,200,185,.12)'; cx.fillRect(0,0,1024,35); cx.fillRect(0,477,1024,35);  
    var t = new THREE.CanvasTexture(cv); t.wrapS = THREE.RepeatWrapping; return t;  
}

/* ========== FALLBACK RENDERER ========== */  
function renderFB(cv, type, w, h) {  
    cv.width = w; cv.height = h; var W = w, H = h, cx = cv.getContext('2d');  
    cx.fillStyle = '#050510'; cx.fillRect(0,0,W,H);  
    for (var i = 0; i < 80; i++) { cx.fillStyle = 'rgba(255,255,255,'+(0.1+Math.random()*0.3)+')'; cx.beginPath(); cx.arc(Math.random()*W,Math.random()*H,.3+Math.random()*.7,0,6.28); cx.fill(); }  
    var cX = W*.5, cY = H*.5, R = Math.min(W,H)*.33;  
    var C = {sun:['#fff8e0','#ffdd44','#ff9900','#cc5500'],mercury:['#c8c4bc','#a8a4a0','#888480','#484440'],venus:['#f5e8c8','#e8d4a0','#d4b878','#8a7040'],earth:['#4488cc','#2266aa','#1a4d8a','#0a2040'],mars:['#e89070','#d46840','#b84828','#602010'],jupiter:['#d4a06a','#c88b3a','#a67b5b','#8b6914'],saturn:['#f0e0b8','#e8d5a3','#c4a265','#a08040'],uranus:['#b8f0f8','#90dce8','#70c4d0','#305860'],neptune:['#6080f0','#4060e0','#2848c8','#101848'],pluto:['#dcc8a8','#c8b490','#b0986c','#584830']};  
    var cols = C[type] || ['#888'];  
    if (type === 'sun') { for (var i2 = 2; i2 >= 0; i2--) { var g = cx.createRadialGradient(cX,cY,R*.3,cX,cY,R*(2+i2*.5)); g.addColorStop(0,'rgba(255,180,30,'+(0.05-i2*0.01)+')'); g.addColorStop(1,'transparent'); cx.fillStyle = g; cx.beginPath(); cx.arc(cX,cY,R*(2+i2*.5),0,6.28); cx.fill(); } }  
    var pg = cx.createRadialGradient(cX-R*.2,cY-R*.2,0,cX,cY,R); cols.forEach(function(c,i3) { pg.addColorStop(i3/(cols.length-1),c); }); cx.fillStyle = pg; cx.beginPath(); cx.arc(cX,cY,R,0,6.28); cx.fill();  
    for (var i4 = 0; i4 < 200; i4++) { var a = Math.random()*6.28, d = Math.random()*R; cx.fillStyle = 'rgba('+(128+Math.random()*127)+','+(128+Math.random()*127)+','+(128+Math.random()*127)+',.05)'; cx.beginPath(); cx.arc(cX+Math.cos(a)*d,cY+Math.sin(a)*d,.5+Math.random()*R*.02,0,6.28); cx.fill(); }  
    if (type !== 'sun') { cx.fillStyle = 'rgba(0,0,0,.3)'; cx.beginPath(); cx.arc(cX+R*.35,cY,R*1.02,-1,1); cx.fill(); }  
}

var actx = null, musOn = false, curPM = null, ambNodes = [], pmNodes = [];  
function initA() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }

function startAmb() {  
    if (!actx) return;  
    var m = actx.createGain(); m.gain.value = 0.025; m.connect(actx.destination);  
    [27.5, 41.2, 55].forEach(function(f, i) {  
        var o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();  
        o.type = 'sine'; o.frequency.value = f;  
        var l = actx.createOscillator(), lg = actx.createGain();  
        l.frequency.value = 0.015 + i * 0.008; lg.gain.value = f * 0.008;  
        l.connect(lg); lg.connect(o.frequency); l.start();  
        fl.type = 'lowpass'; fl.frequency.value = 150 + i * 40; g.gain.value = 0.3 - i * 0.08;  
        o.connect(fl); fl.connect(g); g.connect(m); o.start(); ambNodes.push(o, l);  
    });  
    [880, 1318.5, 1760].forEach(function(f, i) {  
        var o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();  
        o.type = 'sine'; o.frequency.value = f;  
        var l = actx.createOscillator(), lg = actx.createGain();  
        l.frequency.value = 0.03 + i * 0.02; lg.gain.value = f * 0.003;

/* Input */  
renderer.domElement.addEventListener('mousedown', function(e) { isDrag = true; prevMX = e.clientX; prevMY = e.clientY; autoRot = false; });  
renderer.domElement.addEventListener('mousemove', function(e) { mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1; if (isDrag) { tTheta -= (e.clientX-prevMX)*.005; tPhi -= (e.clientY-prevMY)*.005; prevMX = e.clientX; prevMY = e.clientY; } });  
renderer.domElement.addEventListener('mouseup', function() { isDrag = false; });  
renderer.domElement.addEventListener('wheel', function(e) { e.preventDefault(); tDist += e.deltaY * .04; }, {passive: false});  
renderer.domElement.addEventListener('click', function() { ray.setFromCamera(mouse, camera); var h = ray.intersectObjects(meshes); if (h.length) selPlanet(h[0].object.userData.data, h[0].object.userData.idx); });  
var lTD = 0;  
renderer.domElement.addEventListener('touchstart', function(e) { if (e.touches.length===1) { isDrag=true; prevMX=e.touches[0].clientX; prevMY=e.touches[0].clientY; autoRot=false; } if (e.touches.length===2) lTD = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); });  
renderer.domElement.addEventListener('touchmove', function(e) { e.preventDefault(); if (e.touches.length===1 && isDrag) { tTheta -= (e.touches[0].clientX-prevMX)*.005; tPhi -= (e.touches[0].clientY-prevMY)*.005; prevMX = e.touches[0].clientX; prevMY = e.touches[0].clientY; } if (e.touches.length===2) { var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); tDist *= lTD/d; lTD = d; } }, {passive: false});  
renderer.domElement.addEventListener('touchend', function() { isDrag = false; });  
document.addEventListener('keydown', function(e) { if (e.key==='Escape') closeInfo(); if (e.key===' ') { e.preventDefault(); doNova(); } if (e.key==='o'||e.key==='O') togOrb(); if (e.key==='l'||e.key==='L') togLab(); if (e.key==='m'||e.key==='M') togMus(); if (e.key==='r'||e.key==='R') resetCam(); if (e.key==='='||e.key==='+') zmIn(); if (e.key==='-') zmOut(); if (e.key==='ArrowLeft') tTheta += .15; if (e.key==='ArrowRight') tTheta -= .15; if (e.key==='ArrowUp') tPhi = Math.max(.1, tPhi-.1); if (e.key==='ArrowDown') tPhi = Math.min(Math.PI-.1, tPhi+.1); var n = parseInt(e.key); if (!isNaN(n) && n >= 0 && n <= 9) selPlanet(DATA[n], n); });

/* Animation */  
var clock = new THREE.Clock(), tgF = 0;  
function animate() {  
    requestAnimationFrame(animate);  
    var t = clock.getElapsedTime();  
    if (autoRot) tTheta += .0008;  
    updateCam();  
    fillLight.intensity += (tgF - fillLight.intensity) * .08;  
    camFill.intensity += (tgF * .4 - camFill.intensity) * .08;

    meshes.forEach(function(m, i) {  
        var d = DATA[i];  
        m.userData.angle += d.spd * .004 * spdMul;  
        if (d.orbit > 0) { m.position.x = Math.cos(m.userData.angle) * d.orbit; m.position.z = Math.sin(m.userData.angle) * d.orbit; }  
        m.rotation.y += (d.name === 'Sun' ? .001 : .004) * spdMul;  
        if (d.name === 'Uranus') m.rotation.z = 1.71; else if (d.name === 'Earth') m.rotation.z = .41;  
        if (d.name === 'Sun') { sunPt.position.copy(m.position); sunPt2.position.copy(m.position); if (m.userData.glow1) m.userData.glow1.material.uniforms.time.value = t; if (m.userData.glow2) m.userData.glow2.material.uniforms.time.value = t; }  
        if (m.userData.clouds) m.userData.clouds.rotation.y += .0005 * spdMul;  
        if (m.userData.moon) { var a = t * .6; m.userData.moon.position.set(m.position.x + Math.cos(a)*2, Math.sin(a*.4)*.3, m.position.z + Math.sin(a)*2); }  
        if (m.userData.jMoons) m.userData.jMoons.forEach(function(mm, j) { var a2 = t*(.3+j*.15)+j*1.57, md = 4.5+j*1.2; mm.position.set(m.position.x+Math.cos(a2)*md, Math.sin(a2*.3+j)*.3, m.position.z+Math.sin(a2)*md); });  
        if (d.name !== 'Sun') { if (selIdx === i) { m.material.emissiveIntensity += (.45 - m.material.emissiveIntensity) * .08; var sp = meshes[0].position, ts = sp.clone().sub(m.position).normalize(); fillLight.position.copy(m.position).sub(ts.multiplyScalar(d.r*4)); fillLight.visible = true; } else { m.material.emissiveIntensity += (m.userData.origEI - m.material.emissiveIntensity) * .05; } }  
        if (selIdx === i) tCamTarget.copy(m.position);  
        if (lbls[i]) { if (showLab) { var p = m.position.clone(); p.y += d.r + .6; p.project(camera); lbls[i].style.left = (p.x*.5+.5)*window.innerWidth+'px'; lbls[i].style.top = (-p.y*.5+.5)*window.innerHeight+'px'; lbls[i].style.opacity = p.z < 1 ? '0.7' : '0'; } else { lbls[i].style.opacity = '0'; } }  
    });

    orbLines.forEach(function(l) { l.visible = showOrb; });  
    if (selIdx >= 0) tgF = 2.5; else { tgF = 0; fillLight.visible = false; }

    if (!isDrag) {  
        ray.setFromCamera(mouse, camera);  
        var h = ray.intersectObjects(meshes);  
        meshes.forEach(function(m) { if (m.userData.data.name !== 'Sun' && selIdx !== m.userData.idx) m.material.emissiveIntensity = m.userData.origEI; });  
        if (h.length) { var hm = h[0].object; if (hm.userData.data.name !== 'Sun' && selIdx !== hm.userData.idx) hm.material.emissiveIntensity = .2; renderer.domElement.style.cursor = 'pointer'; }  
        else renderer.domElement.style.cursor = 'grab';  
    }

    if (novaOn) { var p2 = Math.min((t-novaT)/3, 1); window._nM.uniforms.time.value = t; window._nM.uniforms.progress.value = p2; window._nMesh.visible = true; if (p2 >= 1) { novaOn = false; window._nMesh.visible = false; } }  
    document.getElementById('zmV').textContent = (55/camDist).toFixed(1) + 'x';  
    renderer.render(scene, camera);  
}

/* ========== SELECT PLANET ========== */  
function selPlanet(d, idx) {  
    selected = d; selIdx = idx; playClick();  
    var m = meshes[idx]; tCamTarget.copy(m.position); tDist = d.r*6+2; tPhi = 1.1;  
    tTheta = Math.atan2(m.position.z, m.position.x) + .6; autoRot = false;  
    document.getElementById('focusName').textContent = d.name.toUpperCase();  
    document.getElementById('focusName').style.opacity = '1';

    if (musOn) startPM(d.name);

    /* Hero image */  
    var hc = document.getElementById('heroContent'); hc.innerHTML = '';  
    tryImg(photoUrls(d.name), function(url) { hc.innerHTML = '<img src="'+url+'" alt="'+d.name+'">'; }, function() {  
        var cv = document.createElement('canvas'); renderFB(cv, TYPES[idx], 840, 400); hc.appendChild(cv);  
    });

    /* Icon */  
    var pw = document.getElementById('piconWrap'); pw.innerHTML = '';  
    tryImg(photoUrls(d.name), function(url) { pw.innerHTML = '<img src="'+url+'" alt="'+d.name+'">'; }, function() {  
        var cv = document.createElement('canvas'); renderFB(cv, TYPES[idx], 120, 120); pw.appendChild(cv);  
    });

    document.getElementById('pcred').textContent = '📷 NASA/JPL-Caltech';  
    document.getElementById('pnm').textContent = d.name;  
    document.getElementById('pty').textContent = d.type;  
    document.getElementById('icard').style.setProperty('--ac', d.css);  
    document.getElementById('icard').style.setProperty('--ac2', d.css + '44');

    var sg = document.getElementById('pst'); sg.innerHTML = '';  
    Object.entries(d.stats).forEach(function(entry) { sg.innerHTML += '<div class="si"><div class="sl">'+entry[0]+'</div><div class="sv">'+entry[1]+'</div></div>'; });

    document.getElementById('pft').textContent = d.fact;  
    var mb = document.getElementById('pmb'), mt = document.getElementById('pmt');  
    if (d.moons.length) { mb.style.display = 'block'; mt.innerHTML = d.moons.map(function(m2) { return '<span class="mg">'+m2+'</span>'; }).join(''); }  
    else mb.style.display = 'none';

    var mi = document.getElementById('musInfo');  
    var pm = PMUS[d.name];  
    mi.textContent = musOn && pm ? '🎵 ' + pm.desc : '';

    document.getElementById('ip').classList.add('open');  
    document.querySelectorAll('.pd').forEach(function(b, i) { b.classList.toggle('sel', i === idx); });  
}

function closeInfo() { document.getElementById('ip').classList.remove('open'); selected = null; selIdx = -1; document.querySelectorAll('.pd').forEach(function(b) { b.classList.remove('sel'); }); document.getElementById('focusName').style.opacity = '0'; tgF = 0; stopPM(); }  
function togOrb() { showOrb = !showOrb; document.getElementById('bOrb').classList.toggle('on', showOrb); }  
function togLab() { showLab = !showLab; document.getElementById('bLab').classList.toggle('on', showLab); }  
function resetCam() { tCamTarget.set(0,0,0); tTheta = .4; tPhi = 1.1; tDist = 55; autoRot = true; closeInfo(); }  
function zmIn() { tDist = Math.max(3, tDist/1.3); }  
function zmOut() { tDist = Math.min(300, tDist*1.3); }  
function spdUp() { spdMul = Math.min(10, spdMul*1.5); document.getElementById('spdV').textContent = spdMul.toFixed(1)+'x'; }  
function spdDn() { spdMul = Math.max(.1, spdMul/1.5); document.getElementById('spdV').textContent = spdMul.toFixed(1)+'x'; }  
function doNova() { novaOn = true; novaT = clock.getElapsedTime(); if (window._nMesh) window._nMesh.visible = true; playNova(); document.body.style.filter = 'brightness(3)'; setTimeout(function() { document.body.style.filter = 'brightness(1)'; }, 100); }

/* Build bottom bar */  
function buildBar() {  
    var bar = document.getElementById('pbar');  
    DATA.forEach(function(d, i) {  
        var el = document.createElement('div'); el.className = 'pd'; el.style.setProperty('--c', d.css);  
        el.innerHTML = '<div class="pd-orb" style="background:radial-gradient(circle at 35% 35%,'+d.g[0]+','+d.g[1]+')"></div><div class="pd-name">'+d.name.toUpperCase()+'</div>';  
        el.addEventListener('click', function() { selPlanet(d, i); });  
        bar.appendChild(el);  
    });  
}

window.addEventListener('resize', function() { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

/* START */  
buildBar();  
init();  
</script>  
</body>  
</html>
